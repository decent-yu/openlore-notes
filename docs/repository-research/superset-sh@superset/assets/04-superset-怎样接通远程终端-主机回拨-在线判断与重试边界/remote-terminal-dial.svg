<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc">
<title id="title">远程终端如何通过主机回拨接通</title>
<desc id="desc">控制连接预先建立。客户端请求终端，中继检查访问权，通知主机携带票据回拨，随后完成客户端升级。主机另连本机终端接口，字节经过中继逐帧转发。中继在线、回拨成功与终端接入是三个不同状态。</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155" stroke-width="1.4"/></marker>
 <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087d6a" stroke-width="1.4"/></marker>
 <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172c43;font-size:17px}.title{font-size:27px;font-weight:650}.small{font-size:15px;fill:#526579}.head{font-size:20px;font-weight:600}.line{stroke:#334155;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.live{stroke:#087d6a;stroke-width:2;fill:none;marker-end:url(#green)}.life{stroke:#a9b5c2;stroke-width:1.3;stroke-dasharray:5 6}.num{font-size:14px;fill:#fff;font-weight:600}</style>
</defs>
<rect width="1120" height="870" fill="#fbfcfe"/>
<text x="35" y="46" class="title">打开远程终端：先找到主机，再为这条流接线</text>
<text x="35" y="76" class="small">源码路径示意；箭头表示消息方向，纵向仅表示先后，不按耗时比例绘制</text>
<rect x="26" y="105" width="238" height="619" rx="5" fill="#edf3f9"/>
<rect x="283" y="105" width="260" height="619" rx="5" fill="#f0f6f5"/>
<rect x="563" y="105" width="533" height="619" rx="5" fill="#f9f3e8"/>
<text x="145" y="140" text-anchor="middle" class="head">另一台电脑的界面</text>
<text x="413" y="140" text-anchor="middle" class="head">中继 / HostTunnel</text>
<text x="696" y="140" text-anchor="middle" class="head">主机隧道客户端</text>
<text x="970" y="140" text-anchor="middle" class="head">本机终端接口</text>
<text x="829" y="168" text-anchor="middle" class="small">二者都在运行代码的那台电脑上</text>
<path d="M145 178V709M413 178V709M696 178V709M970 178V709" class="life"/>
<path d="M696 207H413" class="live"/>
<text x="551" y="195" text-anchor="middle">预先建立控制连接；定时 ping / pong</text>
<rect x="293" y="224" width="240" height="31" rx="4" fill="#d7eee7"/>
<text x="413" y="245" text-anchor="middle" class="small">此时只能确认“控制连接在线”</text>
<circle cx="51" cy="284" r="12" fill="#334155"/><text x="51" y="289" text-anchor="middle" class="num">1</text>
<path d="M145 284H413" class="line"/>
<text x="277" y="274" text-anchor="middle">探查 _whoowns，检查访问权</text>
<path d="M145 337H413" class="line"/>
<text x="278" y="326" text-anchor="middle">请求 /terminal/&lt;id&gt; 升级连接</text>
<circle cx="313" cy="380" r="12" fill="#334155"/><text x="313" y="385" text-anchor="middle" class="num">2</text>
<path d="M413 380H696" class="line"/>
<text x="554" y="368" text-anchor="middle">stream:dial：票据、路径、查询参数</text>
<path d="M696 433H413" class="line"/>
<text x="555" y="420" text-anchor="middle">携票据回拨 /v2/dial</text>
<text x="560" y="456" text-anchor="middle" class="small">主机主动连出，无须客户端直连主机公网端口</text>
<circle cx="313" cy="494" r="12" fill="#334155"/><text x="313" y="499" text-anchor="middle" class="num">3</text>
<path d="M413 494H145" class="line"/>
<text x="280" y="481" text-anchor="middle">回拨到达后，完成 101 升级</text>
<path d="M696 494H970" class="line"/>
<text x="833" y="481" text-anchor="middle">另连 127.0.0.1，换成本机密钥</text>
<text x="830" y="520" text-anchor="middle" class="small">两个动作可能重叠；101 不证明终端已接入</text>
<path d="M970 560H696" class="live"/>
<text x="832" y="548" text-anchor="middle">终端协议：接入确认、输出或错误</text>
<path d="M696 605H413H145" class="live"/>
<text x="420" y="592" text-anchor="middle">输出逐帧经过两段连接，中继不解释终端内容</text>
<path d="M145 660H413H696H970" class="line"/>
<text x="553" y="647" text-anchor="middle">键盘输入沿相反方向转发</text>
<rect x="27" y="747" width="1069" height="98" rx="5" fill="#e8edf3"/>
<text x="48" y="776" font-weight="600">三个状态分别证明三件事</text>
<text x="48" y="807">控制连接在线 → 可以尝试发起回拨</text>
<text x="431" y="807">回拨已到达 → 可以配对传输</text>
<text x="773" y="807">终端接入成功 → 才能实际交互</text>
<text x="48" y="831" class="small">临时帧缓冲只覆盖配对窗口；终端断线后的输出补齐由终端协议负责，不由中继保存完整历史。</text>
</svg>
