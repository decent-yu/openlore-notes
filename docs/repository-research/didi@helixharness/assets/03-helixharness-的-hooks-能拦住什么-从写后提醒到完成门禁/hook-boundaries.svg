<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#40576b" stroke-width="1.4"/></marker></defs>
<rect width="1100" height="660" fill="#f8fafb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203648">
<text x="45" y="48" font-size="27" font-weight="600">Hooks 配好了，是否就能阻止错误？</text>
<text x="45" y="80" font-size="17">沿写入过程区分：配置检查、即时提醒、完成证据检查</text>
<path d="M80 130V590" stroke="#acb9c4" stroke-width="3"/>
<g fill="#256773"><circle cx="80" cy="155" r="10"/><circle cx="80" cy="310" r="10"/><circle cx="80" cy="500" r="10"/></g>
<text x="112" y="157" font-size="21" font-weight="600">初始化</text>
<text x="112" y="185" font-size="16">谁写配置，由宿主声明</text>
<rect x="380" y="115" width="660" height="105" rx="5" fill="#e4f0f2"/>
<text x="402" y="145" font-size="19">Init → 按 owner 合并 → project_hooks_cli.py check</text>
<text x="402" y="176" font-size="17">校验实际 JSON、必需命令与重复项；失败则 Init 不得完成</text>
<text x="402" y="202" font-size="16">此处确认配置存在，没有执行项目检查脚本</text>
<path d="M290 155H366" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="112" y="312" font-size="21" font-weight="600">文件已写入</text>
<text x="112" y="340" font-size="16">宿主若匹配工具事件</text>
<rect x="380" y="260" width="660" height="155" rx="5" fill="#fff0d7"/>
<text x="402" y="291" font-size="19">PostToolUse：Write | Edit | MultiEdit</text>
<text x="402" y="324" font-size="17">invariant-check.sh：项目约束的基础快速检查</text>
<text x="402" y="354" font-size="17">spec-sync-check.sh：按阶段提醒工件缺失，exit 0</text>
<text x="402" y="389" font-size="16">两个命令各截前 50 行；配置没有覆盖任意 shell 写入</text>
<path d="M290 310H366" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="112" y="502" font-size="21" font-weight="600">准备完成需求</text>
<text x="112" y="530" font-size="16">另外进入工作流检查</text>
<rect x="380" y="455" width="660" height="135" rx="5" fill="#e6eaf5"/>
<text x="402" y="486" font-size="19">Apply：最终测试、规范与需求评审 → 验证报告</text>
<text x="402" y="519" font-size="17">Archive：任务、报告字段、内容摘要与评审范围复核</text>
<text x="402" y="553" font-size="16">既有工作流另行执行；不能用写后提醒替代完成证据</text>
<path d="M290 500H366" stroke="#40576b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="631" font-size="16" fill="#536878">范围：当前仓库配置与实现的静态研读；不表示已在真实 Codex / Claude Code 客户端验证触发。</text>
</g></svg>
