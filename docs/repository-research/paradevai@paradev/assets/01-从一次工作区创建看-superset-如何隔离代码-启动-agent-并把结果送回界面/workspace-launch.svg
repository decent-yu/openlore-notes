<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569"/></marker></defs><rect width="1120" height="580" fill="#f8fafc"/><style>text{font-family:system-ui,sans-serif;fill:#172033} .title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#475569}.box{fill:white;stroke:#94a3b8;stroke-width:1.5;rx:10}.edge{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arrow)}</style><text x="35" y="43" class="title">一次创建，三种进度：记录已保存 ≠ 终端已建立 ≠ Agent 已执行</text><text x="35" y="75" class="small">已有项目 · 独立 worktree · 终端 Agent 路径（省略聊天与云端沙箱）</text>
<rect x="35" y="115" width="235" height="100" class="box"/><text x="55" y="147" class="label">桌面界面</text><text x="55" y="176" class="small">临时 ID / 临时列表条目</text><text x="55" y="199" class="small">先订阅，再提交创建</text>
<rect x="355" y="115" width="295" height="100" class="box"/><text x="375" y="147" class="label">主机服务 createEnqueued</text><text x="375" y="176" class="small">检查参数 → 返回请求 ID</text><text x="375" y="199" class="small">当前进程中继续执行 create</text>
<path d="M270 150H355" class="edge"/><text x="278" y="136" class="small">提交</text>
<rect x="740" y="115" width="340" height="100" class="box"/><text x="760" y="147" class="label">Git → 本机数据库</text><text x="760" y="176" class="small">分支与目录 → 保存工作区和标签</text><text x="760" y="199" class="small">插入失败：尝试回收本次 worktree</text><path d="M650 160H740" class="edge"/>
<rect x="740" y="285" width="340" height="115" class="box"/><text x="760" y="318" class="label">Agent 命令 → 终端守护进程</text><text x="760" y="348" class="small">创建 PTY 与 shell → 排入初始命令</text><text x="760" y="375" class="small">单 Agent 可选：setup &amp;&amp; Agent</text><path d="M910 215V285" class="edge"/>
<rect x="35" y="285" width="325" height="115" class="box"/><text x="55" y="318" class="label">界面消费结果</text><text x="55" y="348" class="small">最终 ID 替换临时 ID；建立面板</text><text x="55" y="375" class="small">事件超时：查询工作区记录</text><path d="M740 350H360" class="edge"/><text x="397" y="337" class="small">workspace:create-settled（结束与启动安排）</text>
<path d="M1030 215V246H195V285" class="edge"/><text x="370" y="237" class="small">workspace:changed（记录已保存，修补列表）</text>
<rect x="35" y="445" width="1045" height="95" rx="10" fill="#e8eef7"/><text x="55" y="477" class="label">边界：每个 worktree 工作区隔离目录；同一工作区内的多个 Agent 共享文件</text><text x="55" y="509" class="small">create 的结束事件不等待任务完成；setup 串接成功也只表示命令已安排，脚本失败时 Agent 不会执行。</text></svg>