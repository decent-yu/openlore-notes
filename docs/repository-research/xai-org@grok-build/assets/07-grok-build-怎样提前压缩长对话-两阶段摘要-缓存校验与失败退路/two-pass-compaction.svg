<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc">
  <title id="title">提前摘要如何接上仍在增长的对话</title>
  <desc id="desc">第一阶段在快照上选择前缀并生成摘要一。正式压缩时检查缓存，将摘要一和原边界之后的当前尾部交给第二阶段；失败则转单次压缩。最终重建对话才替换活动历史。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#41556d"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b75b23"/></marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#213349;font-size:20px}
      .small{font-size:17px;fill:#506176}.label{font-size:18px;font-weight:600}.line{fill:none;stroke:#41556d;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="780" fill="#fafbf9"/>
  <text x="42" y="49" style="font-size:29px;font-weight:650">提前摘要先保存候选，正式压缩才替换历史</text>
  <text x="42" y="81" class="small">依据当前源码绘制；长度与时间不按比例，图中的“尾部”仍会经过请求整理。</text>

  <path d="M76 122V684" stroke="#c6cfd7" stroke-width="3"/>
  <circle cx="76" cy="144" r="8" fill="#2a7780"/>
  <circle cx="76" cy="330" r="8" fill="#2a7780"/>
  <circle cx="76" cy="634" r="8" fill="#2a7780"/>
  <text x="112" y="146" class="label">达到提前启动线：读取一次对话快照</text>
  <rect x="112" y="164" width="600" height="49" fill="#d7eceb" stroke="#7da7a7"/>
  <rect x="712" y="164" width="190" height="49" fill="#e9e9e1" stroke="#a9b0a2"/>
  <text x="132" y="195">前缀：目标约占快照估算用量的 95%</text>
  <text x="733" y="195">原有尾部</text>
  <path d="M412 214V244" class="line"/>
  <rect x="288" y="246" width="248" height="47" rx="6" fill="#fff" stroke="#7da7a7"/>
  <text x="311" y="276">第一阶段 → 摘要一</text>
  <text x="566" y="266" class="small">缓存：边界、指纹、模型名</text>
  <text x="566" y="289" class="small">活动对话继续增长，不在此处替换</text>

  <text x="112" y="334" class="label">达到正式压缩线：读取当前对话，沿用原边界</text>
  <rect x="112" y="352" width="600" height="49" fill="#d7eceb" stroke="#7da7a7"/>
  <rect x="712" y="352" width="190" height="49" fill="#e9e9e1" stroke="#a9b0a2"/>
  <rect x="902" y="352" width="215" height="49" fill="#f5dfbd" stroke="#c59b62"/>
  <text x="132" y="383">核对前缀：长度范围、模型名、类型与文本指纹</text>
  <text x="733" y="383">原有尾部</text>
  <text x="924" y="383">后来新增的内容</text>
  <path d="M412 294V351" class="line"/>
  <path d="M412 402V439" class="line"/>
  <text x="433" y="429" class="small">通过</text>
  <path d="M918 402V463H686" class="line"/>
  <rect x="255" y="441" width="430" height="54" rx="6" fill="#fff" stroke="#2a7780" stroke-width="2"/>
  <text x="278" y="475">第二阶段：摘要一 ＋ 当前尾部 → 摘要二</text>
  <path d="M255 468H137V551H255" fill="none" stroke="#b75b23" stroke-width="2" marker-end="url(#orange)"/>
  <text x="147" y="520" class="small" style="fill:#a24f1e">第二阶段失败</text>
  <path d="M164 402V550" fill="none" stroke="#b75b23" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="179" y="426" class="small" style="fill:#a24f1e">缓存缺失或过时</text>
  <rect x="255" y="525" width="430" height="52" rx="6" fill="#fff8ee" stroke="#c59b62"/>
  <text x="279" y="558">单次压缩：按预算整理当前历史后重做摘要</text>
  <path d="M686 468H748V615H1010V657" class="line"/>
  <path d="M686 551H748" fill="none" stroke="#41556d" stroke-width="2.2"/>
  <text x="775" y="530" class="small">摘要合格后进入共同装配路径</text>
  <text x="775" y="554" class="small">失败不会把半成品直接装入历史</text>

  <text x="112" y="639" class="label">重建供下一次模型请求使用的活动对话</text>
  <rect x="112" y="658" width="1005" height="60" rx="6" fill="#e4eef6" stroke="#8ca4bc"/>
  <text x="133" y="694">系统与项目指令 ＋ 最新任务要求 ＋ 最终摘要 ＋ 从运行时重新取得的状态提醒</text>
  <text x="112" y="751" class="small">第二阶段读到的近期工具往返也会被摘要化；它们不会因此全部原样留在新的活动对话中。</text>
</svg>
