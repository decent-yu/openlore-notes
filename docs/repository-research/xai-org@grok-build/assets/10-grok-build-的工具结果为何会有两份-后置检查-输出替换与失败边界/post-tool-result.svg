<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">工具已执行，原始记录与模型所见在此分开</title>
<desc id="desc">普通后置事件读取原始结果，形成替换文字和附加反馈。界面及其更新记录仍依据原始结果生成，模型对话可以收到替换后的文字。后置检查不撤销操作，同批其他工具也可能继续执行。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f6070" stroke-width="1.3"/></marker></defs>
<rect width="1120" height="710" fill="#faf9f5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#25333b">
<text x="48" y="49" font-size="27" font-weight="650">一次工具执行，两份不同用途的材料</text>
<text x="48" y="80" font-size="17" fill="#5b6770">图示普通 PostToolUse 路径；替换已通过校验。箭头表示结果的传递。</text>
<path d="M48 111H1072" stroke="#c8cec9"/>
<text x="50" y="151" font-size="17" fill="#705b3f">已发生的操作</text>
<rect x="48" y="171" width="234" height="97" rx="5" fill="#eee7dc" stroke="#bcaa90"/>
<text x="68" y="205" font-size="21" font-weight="600">工具执行完毕</text>
<text x="68" y="237" font-size="17">命令已运行／文件已写入</text>
<path d="M282 219H336" fill="none" stroke="#4f6070" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="348" y="171" width="258" height="97" rx="5" fill="#fff" stroke="#839499"/>
<text x="368" y="205" font-size="21" font-weight="600">原始工具结果</text>
<text x="368" y="237" font-size="17">包含输出、类型及错误状态</text>
<path d="M606 218H695V177H754" fill="none" stroke="#4f6070" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="768" y="132" width="304" height="124" rx="5" fill="#e9eff2" stroke="#8097a5"/>
<text x="790" y="166" font-size="21" font-weight="600">界面与更新记录</text>
<text x="790" y="198" font-size="17">依据原始结果生成</text>
<text x="790" y="227" font-size="17">后置处理返回后发送工具更新</text>
<path d="M478 268V324" fill="none" stroke="#4f6070" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="348" y="338" width="258" height="133" rx="5" fill="#e9eee6" stroke="#7f9470"/>
<text x="368" y="373" font-size="21" font-weight="600">等待后置 hook</text>
<text x="368" y="405" font-size="17">各处理器读同一原始事件</text>
<text x="368" y="436" font-size="17">收集替换、补充和问题反馈</text>
<path d="M606 404H754" fill="none" stroke="#4f6070" stroke-width="2" marker-end="url(#arrow)"/>
<text x="626" y="389" font-size="16" fill="#526548">校验并选用</text>
<rect x="768" y="338" width="304" height="133" rx="5" fill="#e9eee6" stroke="#7f9470"/>
<text x="790" y="373" font-size="21" font-weight="600">供模型继续工作的对话</text>
<text x="790" y="405" font-size="17">工具结果：可使用替换文字</text>
<text x="790" y="436" font-size="17">后续消息：带来源的补充与反馈</text>
<path d="M348 405H315V532H907V484" fill="none" stroke="#8097a5" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="452" y="516" width="371" height="30" fill="#faf9f5"/>
<text x="464" y="537" font-size="16" fill="#536575">没有有效替换：继续使用原始输出</text>
<text x="48" y="327" font-size="19" fill="#705b3f" font-weight="600">此后不能倒放</text>
<text x="48" y="358" font-size="17">block 只交回问题，</text>
<text x="48" y="387" font-size="17">不撤销已执行的操作。</text>
<path d="M48 586H1072" stroke="#c8cec9"/>
<text x="48" y="620" font-size="19" font-weight="600">等待 hook ≠ 冻结整个工作区</text>
<text x="48" y="652" font-size="17">批量执行由独立任务继续推进；其他已获准工具可能仍在运行或已经完成。</text>
<text x="48" y="680" font-size="15" fill="#68736b">依据：tool_calls.rs、hook_dispatch.rs、post_tool_use_delivery.rs。未表示额外的进程隔离或回滚保证。</text>
</g>
<g fill="#4f6070"><path d="M336 219l-10 -5v10z"/><path d="M754 177l-10 -5v10z"/><path d="M478 324l-5 -10h10z"/><path d="M754 404l-10 -5v10z"/><path d="M907 484l-5 10h10z"/></g>
</svg>
