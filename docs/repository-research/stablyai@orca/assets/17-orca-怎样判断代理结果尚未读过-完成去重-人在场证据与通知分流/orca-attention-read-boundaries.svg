<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34465a" stroke-width="1.3"/></marker></defs>
<rect width="1180" height="790" fill="#fcfaf5"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#24394b">
<text x="48" y="51" font-size="27" font-weight="600">一份代理结果，经过三种不同判断</text>
<text x="48" y="82" font-size="16" fill="#5e6c78">假设场景：人离开电脑，代理结束；窗口仍选中原工作区</text>
<path d="M48 105H1130" stroke="#c8cec9"/>
<text x="48" y="144" font-size="19" font-weight="600">① 是否值得提醒</text>
<rect x="48" y="164" width="220" height="87" rx="8" fill="#e9eef1" stroke="#a6b7c2"/>
<text x="66" y="195" font-size="18">接收代理状态</text><text x="66" y="224" font-size="15">区分旧回放与未见完成</text>
<path d="M270 207H313" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<rect x="324" y="164" width="245" height="87" rx="8" fill="#e9eef1" stroke="#a6b7c2"/>
<text x="342" y="195" font-size="18">完成协调与身份检查</text><text x="342" y="224" font-size="15">适用时等待安静窗口</text>
<path d="M571 207H614" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<rect x="625" y="164" width="260" height="87" rx="8" fill="#e9eef1" stroke="#a6b7c2"/>
<text x="643" y="195" font-size="18">核对当前面板与接收对象</text><text x="643" y="224" font-size="15">过期目标、协调者专属消息退出</text>
<path d="M887 207H928" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<text x="941" y="201" font-size="18" font-weight="600">事件被接受</text><text x="941" y="226" font-size="15">≠ 已展示</text>
<path d="M1003 245V281H215V320" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<path d="M1003 281H768V320" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<text x="48" y="313" font-size="19" font-weight="600">② 是否已经看过</text>
<rect x="48" y="332" width="405" height="160" rx="8" fill="#e4eee7" stroke="#91aa99"/>
<text x="68" y="365" font-size="19" font-weight="600">人在离开 → 先留下未读</text>
<text x="68" y="398" font-size="16">工作区未读 + 具体面板的完成标记</text>
<text x="68" y="428" font-size="16">结果在可见、聚焦且有人观看的标签中</text>
<text x="68" y="457" font-size="16">才可以省略本次未读写入</text>
<text x="625" y="313" font-size="19" font-weight="600">③ 哪些设备允许提醒</text>
<rect x="625" y="332" width="505" height="160" rx="8" fill="#f4e9d7" stroke="#c4aa79"/>
<text x="645" y="365" font-size="19" font-weight="600">再请求通知投递</text>
<path d="M647 382H1107" stroke="#d5c2a2"/>
<text x="645" y="411" font-size="16">手机：先分流 → 后续按偏好与设备状态处理</text>
<text x="645" y="442" font-size="16">桌面：开关 / 主机静音 / 焦点 / 冷却 / 系统权限</text>
<text x="645" y="473" font-size="15" fill="#775c37">请求成功通常不证明人已看到；压制横幅不回滚未读</text>
<path d="M455 368H609" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<text x="479" y="354" font-size="15">写入在前</text>
<path d="M248 495V540" stroke="#34465a" fill="none" marker-end="url(#arr)"/>
<text x="48" y="534" font-size="19" font-weight="600">回来之后</text>
<rect x="48" y="553" width="1082" height="124" rx="8" fill="#fff" stroke="#a6b7c2"/>
<text x="69" y="586" font-size="19" font-weight="600">重新核对当前屏幕 + 窗口焦点 + 人在场证据</text>
<text x="69" y="620" font-size="16">确认对应状态时间 → 清除实际读到的标记 → 请求撤销已宣布的设备通知</text>
<text x="69" y="652" font-size="16" fill="#5e6c78">查询迟到时重查当前对象；未知在场状态保留未读；手动未读保护当前状态片段</text>
<path d="M48 709H1130" stroke="#c8cec9"/>
<text x="48" y="741" font-size="16">读图边界：桌面终端 Hook 路线的机制示意；手机到达、聊天日志位置确认和跨窗口竞争未完整展开。</text>
<text x="48" y="769" font-size="15" fill="#5e6c78">已读是界面推定，通知是展示请求；两者都不证明代码正确或用户理解了结果。</text>
</g></svg>
