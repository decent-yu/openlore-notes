<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#35516a" stroke-width="1.5"/></marker>
    <marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b34c40" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="730" fill="#faf9f5"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243645">
    <text x="44" y="45" font-size="26" font-weight="600">同一个位置，可能已经换了进程</text>
    <text x="44" y="76" font-size="16" fill="#596b76">两种竞态示意：先检查证据对应的身份与时间，再允许它改变当前状态。时间均自上向下。</text>

    <text x="44" y="121" font-size="21" font-weight="600">① 旧清单不能把已替换的进程写回来</text>
    <text x="154" y="158" font-size="17">运行时</text>
    <text x="646" y="158" font-size="17">终端提供者</text>
    <path d="M184 172V341M699 172V341" stroke="#b4bec4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M184 190H697m-9-5l9 5-9 5" fill="none" stroke="#35516a" stroke-width="2"/>
    <text x="306" y="181" font-size="16">开始查询 Q，记录当时的查询代次</text>
    <circle cx="184" cy="236" r="6" fill="#b34c40"/>
    <text x="208" y="241" font-size="16" fill="#a54237">A 退出 / B 注册：生命周期事件使旧查询失效</text>
    <path d="M699 287H186m9-5l-9 5 9 5" fill="none" stroke="#b34c40" stroke-width="2"/>
    <text x="343" y="276" font-size="16">Q 晚到，仍返回旧实例 A</text>
    <path d="M174 301l20 20m0-20l-20 20" stroke="#b34c40" stroke-width="2.5"/>
    <text x="216" y="320" font-size="16" fill="#a54237">丢弃旧清单；指定工作区的查询至多再试一次</text>
    <text x="864" y="202" font-size="16" fill="#596b76">实际保护对象</text>
    <text x="864" y="231" font-size="20" font-weight="600">进程实例 B</text>
    <text x="864" y="261" font-size="15" fill="#596b76">不由旧 A 的记录覆盖</text>

    <path d="M44 365H1076" stroke="#d4d9db"/>
    <text x="44" y="407" font-size="21" font-weight="600">② 旧关闭回执不能移除已换人的本地面板</text>
    <text x="135" y="448" font-size="17">客户端运行时</text>
    <text x="620" y="448" font-size="17">实际执行主机</text>
    <path d="M184 462V638M699 462V638" stroke="#b4bec4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M184 480H697m-9-5l9 5-9 5" fill="none" stroke="#35516a" stroke-width="2"/>
    <text x="315" y="471" font-size="16">请求关闭旧终端 H1</text>
    <circle cx="184" cy="527" r="6" fill="#297d70"/>
    <text x="208" y="532" font-size="16" fill="#25695f">等待期间，同一面板绑定到 H2</text>
    <path d="M699 580H186m9-5l-9 5 9 5" fill="none" stroke="#35516a" stroke-width="2"/>
    <text x="329" y="569" font-size="16">返回 H1 的关闭回执</text>
    <circle cx="184" cy="616" r="6" fill="#297d70"/>
    <text x="208" y="621" font-size="16" fill="#25695f">重读面板绑定：已经变化，跳过本地移除</text>
    <text x="864" y="493" font-size="16" fill="#596b76">实际保护对象</text>
    <text x="864" y="522" font-size="20" font-weight="600">新终端 H2</text>
    <text x="864" y="552" font-size="15" fill="#596b76">H1 的结果仍可返回</text>
    <text x="864" y="577" font-size="15" fill="#596b76">却无权移除 H2 的面板</text>

    <rect x="44" y="664" width="1032" height="42" rx="4" fill="#e9eeed"/>
    <text x="62" y="691" font-size="16">另一条独立约束：请求无法到达执行主机时，关闭直接失败，本地镜像保留，供用户继续核验与重试。</text>
  </g>
</svg>
