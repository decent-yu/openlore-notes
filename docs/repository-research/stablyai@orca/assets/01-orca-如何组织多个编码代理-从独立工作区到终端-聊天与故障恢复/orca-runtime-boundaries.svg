<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3c576d" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183047}.title{font-size:29px;font-weight:650}.sub{font-size:17px;fill:#526b7e}.label{font-size:22px;font-weight:600}.body{font-size:19px}.small{font-size:16px;fill:#526b7e}.line{fill:none;stroke:#3c576d;stroke-width:2}.dotted{stroke-dasharray:7 5}</style><rect width="1200" height="980" fill="#fbfcfe"/><title id="title">Orca 的客户端、执行宿主与持久化边界</title><desc id="desc">桌面经预加载 IPC、CLI 经本地套接字、配对客户端经 WebSocket 进入执行宿主。运行时管理工作区和代理，会调用独立终端后台或结构化代理适配器，并使用分开的持久化状态。</desc><text x="30" y="43" class="title">窗口负责呈现，代码所在主机负责执行</text><text x="30" y="75" class="sub">实线表示调用或数据传递；虚线表示状态读写。省略浏览器与审阅等服务的内部实现。</text><rect x="325" y="105" width="850" height="795" rx="18" fill="#f1f5f8" stroke="#9bb2c3" stroke-width="1.5"/><text x="350" y="140" class="label">执行宿主：桌面主进程，或 Node 服务 orcad</text><rect x="350" y="165" width="800" height="285" rx="10" fill="#ffffff" stroke="#65899f" stroke-width="1.5"/><text x="375" y="202" class="label">OrcaRuntimeService</text><text x="375" y="232" class="small">工作区与代理操作的共同宿主</text><rect x="375" y="252" width="235" height="151" rx="10" fill="#f0f7fb" stroke="#b4c5d2" stroke-width="1.5"/><text x="392" y="283" class="body">工作区创建</text><text x="392" y="312" class="body">目标、Git、元数据</text><text x="392" y="341" class="body">安装与启动顺序</text><rect x="630" y="252" width="230" height="151" rx="10" fill="#f1f7f3" stroke="#b4c5d2" stroke-width="1.5"/><text x="648" y="283" class="body">代理启动</text><text x="648" y="312" class="body">选择终端或聊天</text><text x="648" y="341" class="body">发布结果、投递文本</text><rect x="880" y="252" width="245" height="151" rx="10" fill="#f8f5ee" stroke="#b4c5d2" stroke-width="1.5"/><text x="897" y="283" class="body">状态与扩展服务</text><text x="897" y="312" class="body">终端／聊天状态汇合</text><text x="897" y="341" class="body">文件、浏览器、审阅</text><text x="375" y="433" class="small">入口：本地 IPC；带认证与参数检查的 RPC</text><rect x="25" y="175" width="245" height="123" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="42" y="209" class="label">桌面界面</text><text x="42" y="241" class="small">工作区、标签、终端</text><text x="42" y="266" class="small">预加载层 → IPC</text><rect x="25" y="375" width="245" height="123" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="42" y="409" class="label">命令行 CLI</text><text x="42" y="441" class="small">创建、启动、查询</text><text x="42" y="466" class="small">本地 socket／命名管道</text><rect x="25" y="610" width="245" height="123" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="42" y="644" class="label">配对客户端</text><text x="42" y="676" class="small">手机、网页、其他主机</text><text x="42" y="701" class="small">WebSocket → 宿主路由</text><path d="M270 237H312V305H350" class="line"/><polygon points="350.0,305.0 340.0,309.0 340.0,301.0" fill="#3c576d"/><path d="M270 437H312V420H350" class="line"/><polygon points="350.0,420.0 340.0,424.0 340.0,416.0" fill="#3c576d"/><path d="M270 672H312V434H350" class="line"/><polygon points="350.0,434.0 340.0,438.0 340.0,430.0" fill="#3c576d"/><rect x="350" y="505" width="365" height="175" rx="10" fill="#eaf2fa" stroke="#65899f" stroke-width="1.5"/><text x="373" y="541" class="label">独立终端后台 daemon</text><text x="373" y="578" class="body">PTY 会话与进程</text><text x="373" y="607" class="body">屏幕快照、输出增量</text><text x="373" y="636" class="body">重新连接与输出广播</text><path d="M520 450V505" class="line"/><polygon points="520.0,505.0 516.0,495.0 524.0,495.0" fill="#3c576d"/><text x="537" y="484" class="small">PTY 适配器</text><rect x="780" y="505" width="370" height="110" rx="10" fill="#eef6ef" stroke="#83a18b" stroke-width="1.5"/><text x="802" y="542" class="label">结构化代理适配器</text><text x="802" y="574" class="small">Codex / Claude / Pi / ACP</text><text x="802" y="598" class="small">消息与会话接口</text><path d="M965 450V505" class="line"/><polygon points="965.0,505.0 961.0,495.0 969.0,495.0" fill="#3c576d"/><rect x="350" y="727" width="365" height="76" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="373" y="758" class="label">系统 shell 与代理进程</text><text x="373" y="784" class="small">node-pty 创建；工作目录指向工作区</text><path d="M525 680V727" class="line"/><polygon points="525.0,727.0 521.0,717.0 529.0,717.0" fill="#3c576d"/><rect x="780" y="668" width="370" height="135" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="800" y="703" class="label">持久化记录</text><text x="800" y="734" class="small">SQLite：应用配置与工作区状态</text><text x="800" y="759" class="small">聊天日志：会话记录、操作账本</text><text x="800" y="784" class="small">终端历史由终端子系统管理</text><path d="M1160 450V647H1080V668" class="line dotted"/><polygon points="1080.0,668.0 1076.0,658.0 1084.0,658.0" fill="#3c576d"/><text x="1000" y="643" class="small">状态读写</text><rect x="350" y="835" width="800" height="43" rx="6" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="370" y="864" class="body">磁盘：仓库与多个工作树目录；配置还可建立共享路径</text><path d="M525 803V835" class="line"/><polygon points="525.0,835.0 521.0,825.0 529.0,825.0" fill="#3c576d"/><text x="30" y="934" class="sub">恢复依赖多个事实重新对应：工作区实例 → 稳定面板地址 → 会话／进程 → 已记录结果</text><text x="30" y="963" class="small">依据固定 Commit 444064105c6a…；箭头不表示性能、线程数或所有部署方式。</text></svg>