<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3c576d" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183047}.title{font-size:29px;font-weight:650}.sub{font-size:17px;fill:#526b7e}.label{font-size:22px;font-weight:600}.body{font-size:19px}.small{font-size:16px;fill:#526b7e}.line{fill:none;stroke:#3c576d;stroke-width:2}.dotted{stroke-dasharray:7 5}</style><rect width="1200" height="1280" fill="#fbfcfe"/><title id="title">创建工作区并启动代理的执行路径</title><desc id="desc">共同流程先校验请求与操作编号，再选择终端或聊天。两条路径均创建工作区，终端代理可作为启动终端直接创建，聊天在创建工作区后由主机再次核验。发布代理结果后投递提示词，回执区分已入日志、已交终端及不确定结果。</desc><text x="35" y="44" class="title">一次“创建并启动”，包含几个不同的完成点</text><text x="35" y="77" class="sub">以 CLI 的现代启动接口为例；终端已存在、旧宿主等路径见正文。</text><rect x="260" y="112" width="680" height="87" rx="10" fill="#eef4f9" stroke="#b4c5d2" stroke-width="1.5"/><text x="600" y="148" class="label" text-anchor="middle">CLI：询问能力 → 生成操作编号 → 发送启动请求</text><text x="600" y="178" class="small" text-anchor="middle">支持重放时使用 agent.launchReplay</text><path d="M600 199V233" class="line"/><polygon points="600.0,233.0 596.0,223.0 604.0,223.0" fill="#3c576d"/><rect x="260" y="234" width="680" height="93" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="600" y="271" class="label" text-anchor="middle">宿主：认证、权限与参数检查；操作账本准入</text><text x="600" y="302" class="small" text-anchor="middle">相同操作已有结果 → 直接回放；结果未知 → 拒绝重跑</text><path d="M600 327V365" class="line"/><polygon points="600.0,365.0 596.0,355.0 604.0,355.0" fill="#3c576d"/><rect x="375" y="366" width="450" height="70" rx="10" fill="#f6f2e8" stroke="#bdac80" stroke-width="1.5"/><text x="600" y="408" class="label" text-anchor="middle">根据默认设置与能力，选择启动形式</text><path d="M480 436V467H300V502" class="line"/><polygon points="300.0,502.0 296.0,492.0 304.0,492.0" fill="#3c576d"/><path d="M720 436V467H900V502" class="line"/><polygon points="900.0,502.0 896.0,492.0 904.0,492.0" fill="#3c576d"/><text x="180" y="489" class="small" text-anchor="middle">终端模式</text><text x="1015" y="489" class="small" text-anchor="middle">结构化聊天模式</text><rect x="45" y="504" width="510" height="142" rx="10" fill="#edf4fb" stroke="#84a1ba" stroke-width="1.5"/><text x="67" y="542" class="body">创建工作树，登记身份与基线</text><text x="67" y="571" class="body">补齐共享／复制内容，准备安装</text><text x="67" y="600" class="body">把代理作为工作区启动终端创建</text><text x="67" y="628" class="small">startupAgent 有值</text><rect x="645" y="504" width="510" height="142" rx="10" fill="#eef6ef" stroke="#84a68d" stroke-width="1.5"/><text x="667" y="542" class="body">创建工作树，登记身份与基线</text><text x="667" y="571" class="body">补齐内容，准备安装；暂不建代理终端</text><text x="667" y="600" class="body">按策略等待安装，再向主机核验聊天能力</text><text x="667" y="628" class="small">普通聊天启动的等待最多 60 秒；不证明安装成功</text><path d="M300 646V701" class="line"/><polygon points="300.0,701.0 296.0,691.0 304.0,691.0" fill="#3c576d"/><path d="M900 646V701" class="line"/><polygon points="900.0,701.0 896.0,691.0 904.0,691.0" fill="#3c576d"/><rect x="45" y="703" width="510" height="95" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="67" y="741" class="label">终端后台创建或连接会话</text><text x="67" y="773" class="small">进程、屏幕状态与稳定面板地址对应</text><rect x="645" y="703" width="510" height="95" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="667" y="741" class="label">建立结构化聊天会话</text><text x="667" y="773" class="small">仅确定未创建会话的特定拒绝可回退终端</text><path d="M900 798V835H600V875" class="line"/><polygon points="600.0,875.0 596.0,865.0 604.0,865.0" fill="#3c576d"/><path d="M300 798V835H600" class="line"/><polygon points="600.0,835.0 590.0,839.0 590.0,831.0" fill="#3c576d"/><rect x="250" y="877" width="700" height="90" rx="10" fill="#eef4f9" stroke="#b4c5d2" stroke-width="1.5"/><text x="600" y="914" class="label" text-anchor="middle">发布代理界面与结果，记录中间回执</text><text x="600" y="947" class="small" text-anchor="middle">代理已存在；尚待投递的提示词先记为 unconfirmed</text><path d="M600 967V1005" class="line"/><polygon points="600.0,1005.0 596.0,995.0 604.0,995.0" fill="#3c576d"/><rect x="120" y="1007" width="960" height="95" rx="10" fill="#ffffff" stroke="#b4c5d2" stroke-width="1.5"/><text x="600" y="1043" class="label" text-anchor="middle">投递提示词，再更新结果记录</text><text x="600" y="1076" class="body" text-anchor="middle">终端：随命令或等待就绪后投递　　聊天：提交到消息日志</text><path d="M600 1102V1135" class="line"/><polygon points="600.0,1135.0 596.0,1125.0 604.0,1125.0" fill="#3c576d"/><rect x="90" y="1137" width="1020" height="75" rx="10" fill="#f6f2e8" stroke="#bdac80" stroke-width="1.5"/><text x="600" y="1168" class="body" text-anchor="middle">journaled：已入消息日志　　handed-to-terminal：已交给终端</text><text x="600" y="1196" class="body" text-anchor="middle">not-delivered：未确认投递　　unconfirmed：中断后无法确认投递结果</text><text x="600" y="1252" class="sub" text-anchor="middle">上述任何启动／投递回执，都不能代替代码审阅与任务验证。</text></svg>