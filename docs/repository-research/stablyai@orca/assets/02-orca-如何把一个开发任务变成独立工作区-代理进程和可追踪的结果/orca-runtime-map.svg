<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="845" viewBox="0 0 1200 845" role="img" aria-labelledby="title desc">
<title id="title">Orca 的入口、运行时和进程边界</title><desc id="desc">三个客户端入口连接执行主机上的共同运行时，运行时组织工作区、启动和查询，并连接磁盘、终端进程与结构化代理进程。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#517386"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fa"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="45" font-size="30" fill="#20313d" font-weight="600" text-anchor="start">Orca：请求入口与实际执行的边界</text><text x="40" y="77" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">同一主机可由桌面主进程承载，也可由无窗口 orcad 承载；两者复用运行时类。</text><rect x="40" y="110" width="330" height="112" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="58" y="143" font-size="23" fill="#20313d" font-weight="600" text-anchor="start">桌面窗口</text><text x="58" y="174" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">React 界面 → 预加载桥</text><text x="58" y="201" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">IPC / 目标运行时请求</text><path d="M205.0 222 V264" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="110" width="300" height="112" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="443" y="143" font-size="23" fill="#20313d" font-weight="600" text-anchor="start">orca 命令行</text><text x="443" y="174" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">能力协商与稳定操作编号</text><text x="443" y="201" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">本地套接字 / 命名管道</text><path d="M575.0 222 V264" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="110" width="380" height="112" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="798" y="143" font-size="23" fill="#20313d" font-weight="600" text-anchor="start">手机 / 配对客户端</text><text x="798" y="174" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">显示状态、发送操作</text><text x="798" y="201" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">WebSocket，可经移动中继</text><path d="M970.0 222 V264" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="265" width="1120" height="330" rx="14" fill="#eaf1f5" stroke="#7c9cac"/><text x="62" y="299" font-size="25" fill="#20313d" font-weight="600" text-anchor="start">执行主机：OrcaRuntimeService</text><text x="62" y="328" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">解析工作区归属，组织操作；实际进程由终端提供者或代理适配器创建。</text><rect x="65" y="355" width="310" height="114" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="81" y="388" font-size="22" fill="#20313d" font-weight="600" text-anchor="start">工作区 / Git</text><text x="81" y="419" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">基线、分支、检出目录</text><text x="81" y="446" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">元数据、共享路径、初始化</text><rect x="415" y="355" width="365" height="114" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="431" y="388" font-size="22" fill="#20313d" font-weight="600" text-anchor="start">启动执行器</text><text x="431" y="419" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">选择终端或结构化对话</text><text x="431" y="446" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">记录启动结果与提示词交付</text><rect x="820" y="355" width="315" height="114" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="836" y="388" font-size="22" fill="#20313d" font-weight="600" text-anchor="start">查询与反馈</text><text x="836" y="419" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">终端输出 / 代理状态</text><text x="836" y="446" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">文件、浏览器、代码差异</text><path d="M375 410 H412" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 410 H817" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="499" width="1070" height="69" rx="10" fill="#dce8ed" stroke="#9ab1bd"/><text x="84" y="528" font-size="20" fill="#20313d" font-weight="600" text-anchor="start">持久状态不等于活进程</text><text x="84" y="553" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">配置与工作区元数据 · 会话记录与操作账本 · 结构化对话日志</text><path d="M220 595 V637" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 595 V637" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><path d="M975 595 V637" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="638" width="330" height="114" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="56" y="672" font-size="21" fill="#20313d" font-weight="600" text-anchor="start">磁盘与 Git</text><text x="56" y="704" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">代码检出目录、分支</text><text x="56" y="731" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">配置状态库 / 对话日志库</text><rect x="425" y="638" width="355" height="114" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="441" y="672" font-size="21" fill="#20313d" font-weight="600" text-anchor="start">终端提供者 → PTY 代理</text><text x="441" y="704" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">进程内实现或终端守护进程</text><text x="441" y="731" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">应用退出后能否存活取决于承载</text><rect x="820" y="638" width="340" height="114" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="836" y="672" font-size="21" fill="#20313d" font-weight="600" text-anchor="start">结构化代理适配器</text><text x="836" y="704" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">外部代理协议进程</text><text x="836" y="731" font-size="17" fill="#20313d" font-weight="400" text-anchor="start">例：Codex app-server</text><text x="40" y="790" font-size="17" fill="#526775" font-weight="400" text-anchor="start">箭头表示请求或能力调用；输出与状态沿连接返回。中继只画接入边界，未展开云端内部实现。</text><text x="40" y="819" font-size="16" fill="#526775" font-weight="400" text-anchor="start">依据：启动组装、RPC 传输、工作区创建、终端控制器、适配器注册及日志存储；详见正文源码链接。</text></g></svg>