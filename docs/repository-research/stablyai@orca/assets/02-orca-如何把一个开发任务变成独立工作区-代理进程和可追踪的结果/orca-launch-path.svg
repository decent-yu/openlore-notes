<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1050" viewBox="0 0 1160 1050" role="img" aria-labelledby="title desc">
<title id="title">Orca 新工作区中的代理启动流程</title><desc id="desc">能力协商后先经过账本准入，再创建工作目录，分为终端和结构化路线，最终分别记录代理出现和提示词交付。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#517386"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fa"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="43" font-size="29" fill="#20313d" font-weight="600" text-anchor="start">一次新工作区启动：哪些完成了，哪些仍未知</text><text x="40" y="75" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">自拟任务：修复登录错误。流程依据固定提交源码，非实际运行记录。</text><rect x="270" y="105" width="620" height="70" rx="10" fill="#edf4f7" stroke="#a6b8c2"/><text x="580" y="135" font-size="22" fill="#20313d" font-weight="600" text-anchor="middle">客户端协商能力并提交启动请求</text><text x="580" y="160" font-size="17" fill="#20313d" font-weight="400" text-anchor="middle">支持时携带 operationId，调用 agent.launchReplay</text><path d="M580 175 V212" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="215" width="620" height="75" rx="10" fill="#e2edf1" stroke="#a6b8c2"/><text x="580" y="246" font-size="22" fill="#20313d" font-weight="600" text-anchor="middle">操作账本：取得执行权 / 重放 / 拒绝未知</text><text x="580" y="272" font-size="17" fill="#20313d" font-weight="400" text-anchor="middle">仅取得执行权的请求继续；同编号不等于重新启动</text><path d="M580 290 V324" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="327" width="620" height="78" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="580" y="358" font-size="21" fill="#20313d" font-weight="600" text-anchor="middle">判断模式，创建 Git 工作目录，保存元数据</text><text x="580" y="384" font-size="17" fill="#20313d" font-weight="400" text-anchor="middle">处理共享 / 复制路径，再准备初始化与默认终端</text><path d="M580 405 V430 H290 V465" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 430 H870 V465" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><text x="290" y="454" font-size="20" fill="#20313d" font-weight="600" text-anchor="middle">终端路线</text><text x="870" y="454" font-size="20" fill="#20313d" font-weight="600" text-anchor="middle">结构化路线</text><rect x="65" y="468" width="450" height="124" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="90" y="501" font-size="22" fill="#20313d" font-weight="600" text-anchor="start">创建时携带 startupAgent</text><text x="90" y="534" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">初始化流程可直接产生代理终端</text><text x="90" y="564" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">已有启动终端就复用其结果</text><rect x="645" y="468" width="450" height="124" rx="10" fill="#fff" stroke="#a6b8c2"/><text x="670" y="501" font-size="22" fill="#20313d" font-weight="600" text-anchor="start">创建时不携带 startupAgent</text><text x="670" y="534" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">按策略等待初始化，再复核主机支持</text><text x="670" y="564" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">等待最多 60 秒，继续不代表初始化成功</text><path d="M290 592 V625" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><path d="M870 592 V625" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="628" width="450" height="100" rx="10" fill="#eef5f1" stroke="#a6b8c2"/><text x="90" y="663" font-size="21" fill="#20313d" font-weight="600" text-anchor="start">主机 → 终端控制器 → 提供者</text><text x="90" y="696" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">PTY 中运行代理；主机接收输出</text><rect x="645" y="628" width="450" height="100" rx="10" fill="#eef5f1" stroke="#a6b8c2"/><text x="670" y="663" font-size="21" fill="#20313d" font-weight="600" text-anchor="start">主机 → 会话宿主 → 代理适配器</text><text x="670" y="696" font-size="18" fill="#20313d" font-weight="400" text-anchor="start">外部协议进程；消息进入对话日志</text><path d="M645 678 H518" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="580" y="614" font-size="15" fill="#20313d" font-weight="400" text-anchor="middle">明确未创建，才允许降级</text><path d="M290 728 V758 H580 V785" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><path d="M870 728 V758 H580" fill="none" stroke="#517386" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="788" width="620" height="82" rx="10" fill="#e2edf1" stroke="#a6b8c2"/><text x="580" y="820" font-size="22" fill="#20313d" font-weight="600" text-anchor="middle">先记录代理已出现，再结算文本交付</text><text x="580" y="848" font-size="17" fill="#20313d" font-weight="400" text-anchor="middle">已随命令传入则不重复粘贴；否则等待可输入后提交</text><rect x="40" y="901" width="1080" height="88" rx="10" fill="#fff5e6" stroke="#c4a777"/><text x="62" y="934" font-size="22" fill="#20313d" font-weight="600" text-anchor="start">四件事分别判断</text><text x="62" y="966" font-size="22" fill="#20313d" font-weight="400" text-anchor="start">目录已创建 ≠ 初始化成功 ≠ 文本交付已确认 ≠ 任务正确完成</text><text x="40" y="1023" font-size="17" fill="#526775" font-weight="400" text-anchor="start">虚线：结构化创建明确拒绝时的终端降级；不确定错误不能沿此箭头再启动一个代理。</text></g></svg>