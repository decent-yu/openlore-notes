<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#28666c"/></marker></defs>
  <rect width="1120" height="650" fill="#fbfaf6"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#213c40">
    <text x="48" y="54" font-size="28" font-weight="600">项目筛选作用于新输入，不会自动清空旧会话</text>
    <text x="48" y="87" font-size="17" fill="#596b6c">假设：同一个本地 Agent，先处理项目 P，随后处理项目 Q；引擎会话保持可恢复</text>
    <path d="M90 147H1035" stroke="#b6c2c0" stroke-width="2" marker-end="url(#a)"/>
    <text x="90" y="132" font-size="18">先处理 P</text><text x="650" y="132" font-size="18">再处理 Q</text>
    <rect x="66" y="180" width="420" height="130" rx="6" fill="#eaf1f5" stroke="#9cb7c5"/>
    <text x="88" y="217" font-size="21" font-weight="600">本次自动读取的记忆索引</text>
    <text x="88" y="252" font-size="19">全局 + P</text>
    <text x="88" y="284" font-size="17" fill="#596b6c">不读取 Q 的索引</text>
    <rect x="626" y="180" width="420" height="130" rx="6" fill="#edf3ee" stroke="#9db4a5"/>
    <text x="648" y="217" font-size="21" font-weight="600">本次自动读取的记忆索引</text>
    <text x="648" y="252" font-size="19">全局 + Q</text>
    <text x="648" y="284" font-size="17" fill="#596b6c">不再次读取 P 的索引</text>
    <path d="M276 317V362M836 317V362" stroke="#28666c" stroke-width="2" marker-end="url(#a)"/>
    <rect x="66" y="377" width="980" height="128" rx="8" fill="white" stroke="#28666c" stroke-width="2"/>
    <text x="88" y="413" font-size="22" font-weight="600">同一个可恢复的引擎会话</text>
    <text x="88" y="449" font-size="18">P 阶段输入与工具结果</text>
    <path d="M342 443H571" stroke="#28666c" stroke-width="2" marker-end="url(#a)"/>
    <text x="602" y="449" font-size="18">继续接入 Q 阶段输入</text>
    <text x="88" y="483" font-size="17" fill="#596b6c">此前上下文可能仍由引擎保留或压缩；项目切换本身不会更换会话编号。</text>
    <text x="66" y="554" font-size="20" fill="#8b6337">因此：未再次注入 P 的记忆 ≠ 模型已忘记 P 的背景</text>
    <text x="66" y="591" font-size="17" fill="#596b6c">会话实际保留多少内容取决于引擎。本图说明代码边界，不代表已测得串用或泄漏。</text>
    <text x="66" y="621" font-size="17" fill="#596b6c">依据：AgentRunner.memoryDigest / runWithSessionRecovery 与 EngineSessionStore 的身份维度。</text>
  </g>
</svg>
