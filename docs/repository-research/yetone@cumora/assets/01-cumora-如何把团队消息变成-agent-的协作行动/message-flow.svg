<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="785" viewBox="0 0 1120 785" role="img" aria-label="一条团队消息从提交到结果交付的过程">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506477"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203446}.title{font-size:26px;font-weight:650}.label{font-size:19px;font-weight:600}.body{font-size:16px}.note{font-size:14px;fill:#566a7b}.edge{fill:none;stroke:#506477;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1120" height="785" fill="#f7f8fa"/>
<text x="38" y="45" class="title" text-anchor="start">从“请处理这张卡”到“结果已交付”</text>
<text x="38" y="74" class="note" text-anchor="start">假设案例：群中已有任务卡，用户请求 Agent 完成整理；具体动作由模型决定。</text>
<text x="110" y="120" class="label" text-anchor="middle">客户端</text>
<path d="M110 139V688" stroke="#c5ced6" stroke-dasharray="4 6"/>
<text x="370" y="120" class="label" text-anchor="middle">应用服务与数据库</text>
<path d="M370 139V688" stroke="#c5ced6" stroke-dasharray="4 6"/>
<text x="680" y="120" class="label" text-anchor="middle">唤醒与分诊</text>
<path d="M680 139V688" stroke="#c5ced6" stroke-dasharray="4 6"/>
<text x="985" y="120" class="label" text-anchor="middle">Agent 执行进程</text>
<path d="M985 139V688" stroke="#c5ced6" stroke-dasharray="4 6"/>
<path d="M110 180H370" class="edge"/>
<polygon points="370.0,180.0 361.0,176.0 361.0,184.0" fill="#506477"/>
<text x="240.0" y="168" class="body" text-anchor="middle">1  HTTP 提交消息 + clientId</text>
<rect x="242" y="204" width="256" height="70" rx="9" fill="#fff3dc" stroke="#b8c6d1"/>
<text x="260" y="235" class="label" text-anchor="start">2  同一事务提交</text>
<text x="260" y="265" class="body" text-anchor="start">messages + realtime_outbox</text>
<path d="M370 306H680" class="edge"/>
<polygon points="680.0,306.0 671.0,302.0 671.0,310.0" fill="#506477"/>
<text x="525.0" y="294" class="body" text-anchor="middle">3  outbox 发布 message.new</text>
<path d="M680 358H985" class="edge"/>
<polygon points="985.0,358.0 976.0,354.0 976.0,362.0" fill="#506477"/>
<text x="832.5" y="346" class="body" text-anchor="middle">4  选接收者、分诊后唤醒</text>
<path d="M985 412H370" class="edge"/>
<polygon points="370.0,412.0 379.0,408.0 379.0,416.0" fill="#506477"/>
<text x="677.5" y="400" class="body" text-anchor="middle">5  拉取未读、上下文与身份信息</text>
<rect x="802" y="441" width="280" height="70" rx="9" fill="#e8f5ef" stroke="#b8c6d1"/>
<text x="820" y="472" class="label" text-anchor="start">6  模型决定并调用工具</text>
<text x="820" y="502" class="body" text-anchor="start">云端循环 / 本地引擎会话</text>
<path d="M985 551H370" class="edge"/>
<polygon points="370.0,551.0 379.0,547.0 379.0,555.0" fill="#506477"/>
<text x="677.5" y="539" class="body" text-anchor="middle">7  认领卡、写文档、回复：请求服务端处理</text>
<rect x="242" y="575" width="256" height="70" rx="9" fill="#fff3dc" stroke="#b8c6d1"/>
<text x="260" y="606" class="label" text-anchor="start">8  状态与通知入库</text>
<text x="260" y="636" class="body" text-anchor="start">检查权限；按命令执行协作约束</text>
<path d="M370 683H110" class="edge"/>
<polygon points="110.0,683.0 119.0,679.0 119.0,687.0" fill="#506477"/>
<text x="240.0" y="671" class="body" text-anchor="middle">9  WS 通知；界面更新或拉取</text>
<text x="38" y="739" class="body" text-anchor="start">HTTP 确认提交 ≠ Agent 已完成；模型生成文字 ≠ 已发到聊天；WS 通知 ≠ 唯一事实来源。</text>
<text x="38" y="767" class="note" text-anchor="start">协作动作不是自动固定工作流：卡片完成、文档发布、最终回复需要 Agent 实际调用相应命令。</text>
</svg>