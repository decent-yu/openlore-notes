<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">四种缓存机制，四种工程责任</title><desc id="d">对比复用单元、有效吞吐、恢复语义与维护代价；不混用不同基准的倍数</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#f97316"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">四种缓存机制，四种工程责任</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">对比复用单元、有效吞吐、恢复语义与维护代价；不混用不同基准的倍数</text><rect x="80" y="165" width="330" height="610" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="105" y="210" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">Claude 显式断点</text><rect x="100" y="235" width="290" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="120" y="261" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">匹配单元</text><text x="120" y="284" font-size="13" fill="#475569" font-weight="500" text-anchor="start">请求前缀与内容断点</text><text x="120" y="304" font-size="13" fill="#475569" font-weight="500" text-anchor="start">应用明确划定复用边界</text><rect x="100" y="338" width="290" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="120" y="364" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">吞吐与延迟</text><text x="120" y="387" font-size="13" fill="#475569" font-weight="500" text-anchor="start">托管配额决定并发上限</text><text x="120" y="407" font-size="13" fill="#475569" font-weight="500" text-anchor="start">热前缀减少重复预填充</text><rect x="100" y="441" width="290" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="120" y="467" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">一致性与恢复</text><text x="120" y="490" font-size="13" fill="#475569" font-weight="500" text-anchor="start">缓存丢失后重算</text><text x="120" y="510" font-size="13" fill="#475569" font-weight="500" text-anchor="start">发布幂等由应用实现</text><rect x="100" y="544" width="290" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="120" y="570" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">维护代价</text><text x="120" y="593" font-size="13" fill="#475569" font-weight="500" text-anchor="start">管理断点、配置与 TTL</text><text x="120" y="613" font-size="13" fill="#475569" font-weight="500" text-anchor="start">核对模型计费规则</text><rect x="100" y="647" width="290" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="120" y="673" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">适用结论</text><text x="120" y="696" font-size="13" fill="#475569" font-weight="500" text-anchor="start">固定规则的多角色审查</text><text x="120" y="716" font-size="13" fill="#475569" font-weight="500" text-anchor="start">不适合只靠缓存压长输出</text><rect x="450" y="165" width="330" height="610" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="475" y="210" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">Gemini 隐式缓存</text><rect x="470" y="235" width="290" height="90" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="490" y="261" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">匹配单元</text><text x="490" y="284" font-size="13" fill="#475569" font-weight="500" text-anchor="start">相似请求的共同前缀</text><text x="490" y="304" font-size="13" fill="#475569" font-weight="500" text-anchor="start">服务端自动决定命中</text><rect x="470" y="338" width="290" height="90" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="490" y="364" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">吞吐与延迟</text><text x="490" y="387" font-size="13" fill="#475569" font-weight="500" text-anchor="start">受模型与项目配额约束</text><text x="490" y="407" font-size="13" fill="#475569" font-weight="500" text-anchor="start">应用无法保证每次命中</text><rect x="470" y="441" width="290" height="90" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="490" y="467" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">一致性与恢复</text><text x="490" y="490" font-size="13" fill="#475569" font-weight="500" text-anchor="start">命中不等于结果缓存</text><text x="490" y="510" font-size="13" fill="#475569" font-weight="500" text-anchor="start">失败仍需请求级恢复</text><rect x="470" y="544" width="290" height="90" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="490" y="570" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">维护代价</text><text x="490" y="593" font-size="13" fill="#475569" font-weight="500" text-anchor="start">接入配置较少</text><text x="490" y="613" font-size="13" fill="#475569" font-weight="500" text-anchor="start">依赖用量字段诊断</text><rect x="470" y="647" width="290" height="90" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="490" y="673" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">适用结论</text><text x="490" y="696" font-size="13" fill="#475569" font-weight="500" text-anchor="start">优先降低接入复杂度</text><text x="490" y="716" font-size="13" fill="#475569" font-weight="500" text-anchor="start">不适合依赖固定命中承诺</text><rect x="820" y="165" width="330" height="610" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><text x="845" y="210" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">vLLM 前缀缓存</text><rect x="840" y="235" width="290" height="90" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="860" y="261" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">匹配单元</text><text x="860" y="284" font-size="13" fill="#475569" font-weight="500" text-anchor="start">链式哈希与完整 KV 块</text><text x="860" y="304" font-size="13" fill="#475569" font-weight="500" text-anchor="start">引用计数保护活动块</text><rect x="840" y="338" width="290" height="90" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="860" y="364" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">吞吐与延迟</text><text x="860" y="387" font-size="13" fill="#475569" font-weight="500" text-anchor="start">由模型、GPU 与批量决定</text><text x="860" y="407" font-size="13" fill="#475569" font-weight="500" text-anchor="start">只报满足延迟目标的吞吐</text><rect x="840" y="441" width="290" height="90" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="860" y="467" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">一致性与恢复</text><text x="860" y="490" font-size="13" fill="#475569" font-weight="500" text-anchor="start">缓存块可淘汰与重算</text><text x="860" y="510" font-size="13" fill="#475569" font-weight="500" text-anchor="start">进程重启不等于任务恢复</text><rect x="840" y="544" width="290" height="90" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="860" y="570" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">维护代价</text><text x="860" y="593" font-size="13" fill="#475569" font-weight="500" text-anchor="start">维护模型与 GPU 集群</text><text x="860" y="613" font-size="13" fill="#475569" font-weight="500" text-anchor="start">配置隔离盐与容量策略</text><rect x="840" y="647" width="290" height="90" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="860" y="673" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">适用结论</text><text x="860" y="696" font-size="13" fill="#475569" font-weight="500" text-anchor="start">已有自托管基础设施</text><text x="860" y="716" font-size="13" fill="#475569" font-weight="500" text-anchor="start">不适合低负载只为省 token</text><rect x="1190" y="165" width="330" height="610" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1215" y="210" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">SGLang 基数树</text><rect x="1210" y="235" width="290" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1230" y="261" font-size="15" fill="#f97316" font-weight="700" text-anchor="start">匹配单元</text><text x="1230" y="284" font-size="13" fill="#475569" font-weight="500" text-anchor="start">token 前缀树与节点拆分</text><text x="1230" y="304" font-size="13" fill="#475569" font-weight="500" text-anchor="start">活动节点不可随意淘汰</text><rect x="1210" y="338" width="290" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1230" y="364" font-size="15" fill="#f97316" font-weight="700" text-anchor="start">吞吐与延迟</text><text x="1230" y="387" font-size="13" fill="#475569" font-weight="500" text-anchor="start">复用收益取决于工作集</text><text x="1230" y="407" font-size="13" fill="#475569" font-weight="500" text-anchor="start">缓存亲和需兼顾排队公平</text><rect x="1210" y="441" width="290" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1230" y="467" font-size="15" fill="#f97316" font-weight="700" text-anchor="start">一致性与恢复</text><text x="1230" y="490" font-size="13" fill="#475569" font-weight="500" text-anchor="start">引用释放后允许淘汰</text><text x="1230" y="510" font-size="13" fill="#475569" font-weight="500" text-anchor="start">重试副作用仍由应用负责</text><rect x="1210" y="544" width="290" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1230" y="570" font-size="15" fill="#f97316" font-weight="700" text-anchor="start">维护代价</text><text x="1230" y="593" font-size="13" fill="#475569" font-weight="500" text-anchor="start">维护调度与多级 KV</text><text x="1230" y="613" font-size="13" fill="#475569" font-weight="500" text-anchor="start">卸载引入传输与同步成本</text><rect x="1210" y="647" width="290" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1230" y="673" font-size="15" fill="#f97316" font-weight="700" text-anchor="start">适用结论</text><text x="1230" y="696" font-size="13" fill="#475569" font-weight="500" text-anchor="start">高复用、多分支工作负载</text><text x="1230" y="716" font-size="13" fill="#475569" font-weight="500" text-anchor="start">不适合忽略冷流量尾延迟</text><text x="800" y="822" font-size="16" fill="#64748b" font-weight="500" text-anchor="middle">没有同模型、同硬件、同负载的统一排名；缓存复用不能替代审查质量评估</text></g></svg>