<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">先判断测量是否可信，再决定改动哪里</title><desc id="d">阈值由产品风险与本地基线确定；不将通用示例冒充 Numan 生产 SLO</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#1d4ed8"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#6d28d9"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#166534"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ea580c"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#dc2626"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">先判断测量是否可信，再决定改动哪里</text><text x="800" y="116" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">阈值由产品风险与本地基线确定；不将通用示例冒充 Numan 生产 SLO</text><rect x="80" y="165" width="1440" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="165" width="1440" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="104" y="203" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">入口：安全指标回退、P99 上升或评分突然变化</text><text x="104" y="235" font-size="16" fill="#475569" font-weight="400" text-anchor="start">先区分用户已见的违规、评估器异常与运行时拥塞，再沿分支定位；严重用户可见违规立即停止放量</text><path d="M300 269 V326" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/><polygon points="300.0,326.0 291.25,308.5 308.75,308.5" fill="#475569"/><path d="M800 269 V326" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/><polygon points="800.0,326.0 791.25,308.5 808.75,308.5" fill="#475569"/><path d="M1300 269 V326" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/><polygon points="1300.0,326.0 1291.25,308.5 1308.75,308.5" fill="#475569"/><rect x="80" y="330" width="440" height="130" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="330" width="440" height="130" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="104" y="368" font-size="21" fill="#dc2626" font-weight="700" text-anchor="start">用户是否已见违规？</text><text x="104" y="400" font-size="16" fill="#475569" font-weight="400" text-anchor="start">是：冻结发布 / 回滚候选</text><text x="104" y="426" font-size="16" fill="#475569" font-weight="400" text-anchor="start">核查前端是否绕过输出护栏</text><rect x="580" y="330" width="440" height="130" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="580" y="330" width="440" height="130" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="604" y="368" font-size="21" fill="#ea580c" font-weight="700" text-anchor="start">人工与裁判是否分歧？</text><text x="604" y="400" font-size="16" fill="#475569" font-weight="400" text-anchor="start">是：冻结自动提示词优化</text><text x="604" y="426" font-size="16" fill="#475569" font-weight="400" text-anchor="start">检查标准冲突与裁判版本</text><rect x="1080" y="330" width="440" height="130" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1080" y="330" width="440" height="130" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1104" y="368" font-size="21" fill="#6d28d9" font-weight="700" text-anchor="start">排队或延迟是否增长？</text><text x="1104" y="400" font-size="16" fill="#475569" font-weight="400" text-anchor="start">是：拆开目标与评分调用</text><text x="1104" y="426" font-size="16" fill="#475569" font-weight="400" text-anchor="start">定位配额、连接池与检查点</text><path d="M300 464 V516" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/><polygon points="300.0,516.0 291.25,498.5 308.75,498.5" fill="#475569"/><path d="M800 464 V516" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/><polygon points="800.0,516.0 791.25,498.5 808.75,498.5" fill="#475569"/><path d="M1300 464 V516" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/><polygon points="1300.0,516.0 1291.25,498.5 1308.75,498.5" fill="#475569"/><rect x="80" y="520" width="440" height="210" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="520" width="440" height="210" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="104" y="558" font-size="21" fill="#dc2626" font-weight="700" text-anchor="start">安全分支</text><text x="104" y="590" font-size="16" fill="#475569" font-weight="400" text-anchor="start">检查草稿流是否提前发出</text><text x="104" y="616" font-size="16" fill="#475569" font-weight="400" text-anchor="start">检查超时是否默认为通过</text><text x="104" y="642" font-size="16" fill="#475569" font-weight="400" text-anchor="start">检查重试是否超过预算</text><text x="104" y="668" font-size="16" fill="#475569" font-weight="400" text-anchor="start">检查跨会话与工具权限隔离</text><text x="104" y="694" font-size="16" fill="#475569" font-weight="400" text-anchor="start">保留失败样本并转人工复核</text><rect x="580" y="520" width="440" height="210" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="580" y="520" width="440" height="210" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="604" y="558" font-size="21" fill="#ea580c" font-weight="700" text-anchor="start">测量分支</text><text x="604" y="590" font-size="16" fill="#475569" font-weight="400" text-anchor="start">确认场景有无可观察机会</text><text x="604" y="616" font-size="16" fill="#475569" font-weight="400" text-anchor="start">逐条查标准互斥与证据片段</text><text x="604" y="642" font-size="16" fill="#475569" font-weight="400" text-anchor="start">盲审模型名并交换答案顺序</text><text x="604" y="668" font-size="16" fill="#475569" font-weight="400" text-anchor="start">裁判故障单列为不可评分</text><text x="604" y="694" font-size="16" fill="#475569" font-weight="400" text-anchor="start">使用冻结保留集重测候选</text><rect x="1080" y="520" width="440" height="210" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1080" y="520" width="440" height="210" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1104" y="558" font-size="21" fill="#6d28d9" font-weight="700" text-anchor="start">运行分支</text><text x="1104" y="590" font-size="16" fill="#475569" font-weight="400" text-anchor="start">先看 429 / 超时 / 重试次数</text><text x="1104" y="616" font-size="16" fill="#475569" font-weight="400" text-anchor="start">再看护栏与专家节点耗时</text><text x="1104" y="642" font-size="16" fill="#475569" font-weight="400" text-anchor="start">对照队列深度和数据库等待</text><text x="1104" y="668" font-size="16" fill="#475569" font-weight="400" text-anchor="start">恢复后对比消息与工具顺序</text><text x="1104" y="694" font-size="16" fill="#475569" font-weight="400" text-anchor="start">缩减离线并发保护在线预算</text><rect x="80" y="770" width="1440" height="60" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="770" width="1440" height="60" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="800" y="807" font-size="18" fill="#166534" font-weight="600" text-anchor="middle">恢复放量条件：根因已复现、失败场景进入回归、分类门禁通过、回滚路径已验证</text></g></svg>