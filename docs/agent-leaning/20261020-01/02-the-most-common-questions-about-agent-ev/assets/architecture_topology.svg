<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">从真实轨迹到可验证交付</title><desc id="desc">参考架构 · 执行产生状态，评测读取证据，门禁消费结论</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#f97316"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">从真实轨迹到可验证交付</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">参考架构 · 执行产生状态，评测读取证据，门禁消费结论</text><rect x="80" y="160" width="440" height="660" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="160" width="440" height="6" rx="3" fill="#3b82f6"/><text x="110" y="211" font-size="22" fill="#1d4ed8" font-weight="700">证据与契约</text><text x="110" y="241" font-size="13" fill="#475569" font-weight="400">固定样例、版本和验收不变量</text><rect x="580" y="160" width="440" height="660" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="580" y="160" width="440" height="6" rx="3" fill="#8b5cf6"/><text x="610" y="211" font-size="22" fill="#6d28d9" font-weight="700">执行与隔离</text><text x="610" y="241" font-size="13" fill="#475569" font-weight="400">离线重放与线上观察分别处理</text><rect x="1080" y="160" width="440" height="660" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1080" y="160" width="440" height="6" rx="3" fill="#10b981"/><text x="1110" y="211" font-size="22" fill="#166534" font-weight="700">分层验收</text><text x="1110" y="241" font-size="13" fill="#475569" font-weight="400">结果、过程与语义分别留证</text><rect x="110" y="280" width="380" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="134" y="316" font-size="20" fill="#1d4ed8" font-weight="700">版本化离线样例</text><text x="134" y="346" font-size="13" fill="#475569" font-weight="400">输入＋初始状态＋工具快照</text><text x="134" y="371" font-size="13" fill="#475569" font-weight="400">Agent / 模型 / 裁判版本</text><rect x="110" y="455" width="380" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="134" y="491" font-size="20" fill="#1d4ed8" font-weight="700">生产轨迹与会话</text><text x="134" y="521" font-size="13" fill="#475569" font-weight="400">调用标识＋授权事件＋终态</text><text x="134" y="546" font-size="13" fill="#475569" font-weight="400">脱敏、结束确认、随机抽样</text><rect x="110" y="630" width="380" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="134" y="666" font-size="20" fill="#1d4ed8" font-weight="700">业务契约与留出集</text><text x="134" y="696" font-size="13" fill="#475569" font-weight="400">目标状态与禁止副作用</text><text x="134" y="721" font-size="13" fill="#475569" font-weight="400">开发集优化，留出集验收</text><rect x="610" y="280" width="380" height="130" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="634" y="316" font-size="20" fill="#6d28d9" font-weight="700">干净环境执行</text><text x="634" y="346" font-size="13" fill="#475569" font-weight="400">固定镜像、CPU / RAM 与时限</text><text x="634" y="371" font-size="13" fill="#475569" font-weight="400">独立任务空间和尝试编号</text><rect x="610" y="455" width="380" height="130" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="634" y="491" font-size="20" fill="#6d28d9" font-weight="700">线上异步评测</text><text x="634" y="521" font-size="13" fill="#475569" font-weight="400">只读取证据，不重做真实写入</text><text x="634" y="546" font-size="13" fill="#475569" font-weight="400">模拟工具用于脱敏重放</text><rect x="610" y="630" width="380" height="130" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="634" y="666" font-size="20" fill="#6d28d9" font-weight="700">证据包与资源回收</text><text x="634" y="696" font-size="13" fill="#475569" font-weight="400">轨迹＋产物＋运行诊断</text><text x="634" y="721" font-size="13" fill="#475569" font-weight="400">先保存现场，再销毁环境</text><rect x="1110" y="280" width="380" height="130" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1134" y="316" font-size="20" fill="#166534" font-weight="700">代码断言与终态验收</text><text x="1134" y="346" font-size="13" fill="#475569" font-weight="400">日期、金额、文件与数据库</text><text x="1134" y="371" font-size="13" fill="#475569" font-weight="400">禁止副作用单独硬门槛</text><rect x="1110" y="455" width="380" height="130" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1134" y="491" font-size="20" fill="#c2410c" font-weight="700">轨迹约束与语义裁判</text><text x="1134" y="521" font-size="13" fill="#475569" font-weight="400">先决条件、工具参数、回答</text><text x="1134" y="546" font-size="13" fill="#475569" font-weight="400">人工校准与争议复核</text><rect x="1110" y="630" width="380" height="130" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1134" y="666" font-size="20" fill="#166534" font-weight="700">实验对比与发布控制</text><text x="1134" y="696" font-size="13" fill="#475569" font-weight="400">按业务分组统计，保留错误</text><text x="1134" y="721" font-size="13" fill="#475569" font-weight="400">质量、成本、时延分别门禁</text><line x1="522" y1="345" x2="576" y2="345" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><line x1="1022" y1="345" x2="1076" y2="345" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><line x1="522" y1="520" x2="576" y2="520" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><line x1="1022" y1="520" x2="1076" y2="520" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><line x1="800" y1="587" x2="800" y2="626" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><text x="800" y="860" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">工程建议：新失败进入回归样例；首次失败、重试和判分错误分别保留</text><path d="M990 375 H1004 V695 H994" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><line x1="522" y1="695" x2="576" y2="695" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><line x1="1022" y1="695" x2="1076" y2="695" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/></g></svg>