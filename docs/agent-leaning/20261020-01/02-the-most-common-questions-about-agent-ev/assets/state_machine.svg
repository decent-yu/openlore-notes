<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">让评测失败可归因、可恢复</title><desc id="desc">建议状态机 · 环境与裁判错误不混入业务结论，重跑保留独立尝试</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#f97316"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">让评测失败可归因、可恢复</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">建议状态机 · 环境与裁判错误不混入业务结论，重跑保留独立尝试</text><rect x="80" y="230" width="280" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="266" font-size="20" fill="#1d4ed8" font-weight="700">待执行</text><text x="104" y="296" font-size="13" fill="#475569" font-weight="400">固定输入与版本</text><text x="104" y="321" font-size="13" fill="#475569" font-weight="400">分配独立尝试编号</text><text x="104" y="346" font-size="13" fill="#475569" font-weight="400">初始化环境夹具</text><rect x="460" y="230" width="300" height="170" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="484" y="266" font-size="20" fill="#6d28d9" font-weight="700">执行中</text><text x="484" y="296" font-size="13" fill="#475569" font-weight="400">记录动作与终态</text><text x="484" y="321" font-size="13" fill="#475569" font-weight="400">CPU / RAM / 时限约束</text><text x="484" y="346" font-size="13" fill="#475569" font-weight="400">禁止污染其他任务</text><rect x="860" y="230" width="300" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="884" y="266" font-size="20" fill="#1d4ed8" font-weight="700">验收中</text><text x="884" y="296" font-size="13" fill="#475569" font-weight="400">代码、轨迹、语义检查</text><text x="884" y="321" font-size="13" fill="#475569" font-weight="400">收集可信产物与证据</text><text x="884" y="346" font-size="13" fill="#475569" font-weight="400">确认裁判执行完整</text><rect x="1260" y="230" width="260" height="170" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1284" y="266" font-size="20" fill="#166534" font-weight="700">通过</text><text x="1284" y="296" font-size="13" fill="#475569" font-weight="400">全部硬约束满足</text><text x="1284" y="321" font-size="13" fill="#475569" font-weight="400">保存各维度结论</text><text x="1284" y="346" font-size="13" fill="#475569" font-weight="400">进入发布决策</text><rect x="460" y="540" width="300" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="484" y="576" font-size="20" fill="#c2410c" font-weight="700">环境错误</text><text x="484" y="606" font-size="13" fill="#475569" font-weight="400">OOM、网络或启动异常</text><text x="484" y="631" font-size="13" fill="#475569" font-weight="400">诊断后有限重试</text><text x="484" y="656" font-size="13" fill="#475569" font-weight="400">保留首次现场</text><rect x="860" y="540" width="300" height="150" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><text x="884" y="576" font-size="20" fill="#b91c1c" font-weight="700">任务失败</text><text x="884" y="606" font-size="13" fill="#475569" font-weight="400">有效验收发现业务违规</text><text x="884" y="631" font-size="13" fill="#475569" font-weight="400">不得用重试覆盖失败</text><text x="884" y="656" font-size="13" fill="#475569" font-weight="400">回归样例与问题归因</text><rect x="1260" y="540" width="260" height="150" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1284" y="576" font-size="20" fill="#c2410c" font-weight="700">判分错误</text><text x="1284" y="606" font-size="13" fill="#475569" font-weight="400">无结果或裁判异常</text><text x="1284" y="631" font-size="13" fill="#475569" font-weight="400">校准后重新判分</text><text x="1284" y="656" font-size="13" fill="#475569" font-weight="400">保留原判分版本</text><line x1="362" y1="315" x2="456" y2="315" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><text x="410" y="297" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">启动</text><line x1="762" y1="315" x2="856" y2="315" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><text x="810" y="297" font-size="13" fill="#6d28d9" font-weight="600" text-anchor="middle">完成</text><line x1="1162" y1="315" x2="1256" y2="315" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/><text x="1210" y="297" font-size="13" fill="#166534" font-weight="600" text-anchor="middle">满足</text><line x1="610" y1="402" x2="610" y2="536" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><text x="634" y="475" font-size="13" fill="#c2410c" font-weight="600">资源或依赖异常</text><line x1="1010" y1="402" x2="1010" y2="536" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/><text x="1034" y="475" font-size="13" fill="#b91c1c" font-weight="600">有效判失败</text><path d="M1162 365 H1210 V615 H1256" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><text x="1232" y="504" font-size="13" fill="#c2410c" font-weight="600">裁判异常</text><path d="M458 615 H400 V460 H220 V404" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,6" marker-end="url(#arr-blue)"/><text x="250" y="493" font-size="13" fill="#1d4ed8" font-weight="600">新尝试重跑</text><rect x="80" y="750" width="1440" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><text x="110" y="783" font-size="16" fill="#334155" font-weight="700">保存证据，再回收资源</text><text x="110" y="809" font-size="13" fill="#475569">轨迹、产物、诊断与尝试关系</text><text x="610" y="783" font-size="16" fill="#334155" font-weight="700">同时报告两种成功比例</text><text x="610" y="809" font-size="13" fill="#475569">全部尝试与可判分样本分别统计</text><text x="1110" y="783" font-size="16" fill="#334155" font-weight="700">预先约定资源契约</text><text x="1110" y="809" font-size="13" fill="#475569">明确超限行为的失败归类</text></g></svg>