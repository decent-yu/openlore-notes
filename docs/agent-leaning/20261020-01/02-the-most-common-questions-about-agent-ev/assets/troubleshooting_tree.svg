<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">质量告警排障：先确认量具是否正常</title><desc id="desc">按覆盖、执行、判分与业务依次分流 · 阈值由基线和业务风险确定</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#f97316"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">质量告警排障：先确认量具是否正常</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">按覆盖、执行、判分与业务依次分流 · 阈值由基线和业务风险确定</text><rect x="80" y="200" width="340" height="140" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="236" font-size="20" fill="#1d4ed8" font-weight="700">出现质量或成本告警</text><text x="104" y="266" font-size="13" fill="#475569" font-weight="400">核对数据、模型、工具版本</text><text x="104" y="291" font-size="13" fill="#475569" font-weight="400">核对裁判、资源与重试变化</text><rect x="520" y="200" width="400" height="140" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="544" y="236" font-size="20" fill="#1d4ed8" font-weight="700">1. 评测覆盖完整？</text><text x="544" y="266" font-size="13" fill="#475569" font-weight="400">查看未判分数量与最老年龄</text><text x="544" y="291" font-size="13" fill="#475569" font-weight="400">核对采样率、预算暂停状态</text><rect x="1040" y="200" width="480" height="140" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1064" y="236" font-size="20" fill="#c2410c" font-weight="700">恢复评测覆盖</text><text x="1064" y="266" font-size="13" fill="#475569" font-weight="400">检查抽样、留存、队列和支出上限</text><text x="1064" y="291" font-size="13" fill="#475569" font-weight="400">恢复后对缺失窗口补判</text><rect x="520" y="420" width="400" height="140" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="544" y="456" font-size="20" fill="#6d28d9" font-weight="700">2. 环境或判分错误上升？</text><text x="544" y="486" font-size="13" fill="#475569" font-weight="400">检查 429、OOM、镜像与 reward</text><text x="544" y="511" font-size="13" fill="#475569" font-weight="400">区分任务超时和服务异常</text><rect x="1040" y="420" width="480" height="140" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1064" y="456" font-size="20" fill="#c2410c" font-weight="700">处理执行与判分故障</text><text x="1064" y="486" font-size="13" fill="#475569" font-weight="400">限制并发，修复环境或裁判配置</text><text x="1064" y="511" font-size="13" fill="#475569" font-weight="400">先留现场，再按预算重跑或重判</text><rect x="520" y="640" width="400" height="140" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="544" y="676" font-size="20" fill="#1d4ed8" font-weight="700">3. 人审同意失败判断？</text><text x="544" y="706" font-size="13" fill="#475569" font-weight="400">复核终态、轨迹与完整会话</text><text x="544" y="731" font-size="13" fill="#475569" font-weight="400">用冻结轨迹隔离裁判变化</text><rect x="1040" y="640" width="480" height="140" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1064" y="676" font-size="20" fill="#c2410c" font-weight="700">校准裁判与证据映射</text><text x="1064" y="706" font-size="13" fill="#475569" font-weight="400">检查标签、位置偏差和证据缺失</text><text x="1064" y="731" font-size="13" fill="#475569" font-weight="400">修正规则，再对同批轨迹复评</text><rect x="80" y="640" width="340" height="140" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="676" font-size="20" fill="#b91c1c" font-weight="700">定位真实业务回归</text><text x="104" y="706" font-size="13" fill="#475569" font-weight="400">按任务类型比对新旧版本</text><text x="104" y="731" font-size="13" fill="#475569" font-weight="400">越权或副作用违规停止放量</text><line x1="422" y1="270" x2="516" y2="270" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><text x="470" y="253" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">核查</text><line x1="922" y1="270" x2="1036" y2="270" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><text x="980" y="253" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">否</text><line x1="720" y1="342" x2="720" y2="416" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><text x="744" y="384" font-size="13" fill="#1d4ed8" font-weight="600">是</text><line x1="922" y1="490" x2="1036" y2="490" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><text x="980" y="473" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">是</text><line x1="720" y1="562" x2="720" y2="636" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><text x="744" y="604" font-size="13" fill="#1d4ed8" font-weight="600">否</text><line x1="922" y1="710" x2="1036" y2="710" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><text x="980" y="693" font-size="13" fill="#c2410c" font-weight="600" text-anchor="middle">否</text><line x1="518" y1="710" x2="424" y2="710" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/><text x="470" y="693" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle">是</text><text x="800" y="850" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">巡检指标：覆盖率 / 队列年龄 · 环境错误 · 裁判混淆矩阵 · 终态成功与副作用</text></g></svg>