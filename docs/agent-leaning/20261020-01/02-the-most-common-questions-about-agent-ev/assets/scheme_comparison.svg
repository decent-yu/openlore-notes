<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">三类评测方案：按验证对象选工具</title><desc id="desc">无统一工作负载的公开吞吐排名 · 以下比较机制与约束</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#f97316"/></marker><marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, &#39;PingFang SC&#39;, &#39;Microsoft YaHei&#39;, sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">三类评测方案：按验证对象选工具</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">无统一工作负载的公开吞吐排名 · 以下比较机制与约束</text><rect x="80" y="160" width="440" height="660" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="160" width="440" height="6" rx="3" fill="#3b82f6"/><text x="110" y="211" font-size="22" fill="#1d4ed8" font-weight="700">LangSmith＋agentevals</text><text x="110" y="241" font-size="13" fill="#475569" font-weight="400">围绕轨迹组织质量证据</text><rect x="110" y="272" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="134" y="299" font-size="16" fill="#334155" font-weight="700">架构中心</text><text x="134" y="324" font-size="13" fill="#475569" font-weight="400">trace → 数据集 → 实验</text><text x="134" y="345" font-size="13" fill="#475569" font-weight="400">工具轨迹与人工反馈关联</text><rect x="110" y="380" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="134" y="407" font-size="16" fill="#334155" font-weight="700">吞吐与延迟</text><text x="134" y="432" font-size="13" fill="#475569" font-weight="400">受模型配额和裁判耗时限制</text><text x="134" y="453" font-size="13" fill="#475569" font-weight="400">长轨迹增加传输与存储量</text><rect x="110" y="488" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="134" y="515" font-size="16" fill="#334155" font-weight="700">一致性与恢复</text><text x="134" y="540" font-size="13" fill="#475569" font-weight="400">固定数据集与评分版本</text><text x="134" y="561" font-size="13" fill="#475569" font-weight="400">执行错误和评测错误留档</text><rect x="110" y="596" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="134" y="623" font-size="16" fill="#334155" font-weight="700">运维心智负担</text><text x="134" y="648" font-size="13" fill="#475569" font-weight="400">维护埋点、采样与留存</text><text x="134" y="669" font-size="13" fill="#475569" font-weight="400">适合持续观察生产质量</text><rect x="110" y="720" width="380" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="134" y="747" font-size="14" fill="#1d4ed8" font-weight="700">适用：生产反馈与回归联动</text><text x="134" y="772" font-size="13" fill="#475569" font-weight="400">补齐：可信业务终态验收</text><rect x="580" y="160" width="440" height="660" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="580" y="160" width="440" height="6" rx="3" fill="#8b5cf6"/><text x="610" y="211" font-size="22" fill="#6d28d9" font-weight="700">Promptfoo</text><text x="610" y="241" font-size="13" fill="#475569" font-weight="400">围绕配置组织批量实验</text><rect x="610" y="272" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="634" y="299" font-size="16" fill="#334155" font-weight="700">架构中心</text><text x="634" y="324" font-size="13" fill="#475569" font-weight="400">输入 × provider × 断言</text><text x="634" y="345" font-size="13" fill="#475569" font-weight="400">支持自定义与轨迹相关检查</text><rect x="610" y="380" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="634" y="407" font-size="16" fill="#334155" font-weight="700">吞吐与延迟</text><text x="634" y="432" font-size="13" fill="#475569" font-weight="400">并发、配额和断言决定速度</text><text x="634" y="453" font-size="13" fill="#475569" font-weight="400">重复性实验需控制缓存</text><rect x="610" y="488" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="634" y="515" font-size="16" fill="#334155" font-weight="700">一致性与恢复</text><text x="634" y="540" font-size="13" fill="#475569" font-weight="400">配置与缓存策略一起固定</text><text x="634" y="561" font-size="13" fill="#475569" font-weight="400">单例及整批设置超时</text><rect x="610" y="596" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="634" y="623" font-size="16" fill="#334155" font-weight="700">运维心智负担</text><text x="634" y="648" font-size="13" fill="#475569" font-weight="400">维护配置、适配器与 CI</text><text x="634" y="669" font-size="13" fill="#475569" font-weight="400">适合多模型和提示词回归</text><rect x="610" y="720" width="380" height="70" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="634" y="747" font-size="14" fill="#6d28d9" font-weight="700">适用：配置驱动的 CI 验证</text><text x="634" y="772" font-size="13" fill="#475569" font-weight="400">补齐：长任务的环境治理</text><rect x="1080" y="160" width="440" height="660" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1080" y="160" width="440" height="6" rx="3" fill="#10b981"/><text x="1110" y="211" font-size="22" fill="#166534" font-weight="700">Harbor</text><text x="1110" y="241" font-size="13" fill="#475569" font-weight="400">围绕隔离任务验证产物</text><rect x="1110" y="272" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="1134" y="299" font-size="16" fill="#334155" font-weight="700">架构中心</text><text x="1134" y="324" font-size="13" fill="#475569" font-weight="400">环境 → Agent → verifier</text><text x="1134" y="345" font-size="13" fill="#475569" font-weight="400">测试写 reward 后解析</text><rect x="1110" y="380" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="1134" y="407" font-size="16" fill="#334155" font-weight="700">吞吐与延迟</text><text x="1134" y="432" font-size="13" fill="#475569" font-weight="400">受沙箱数与任务时长限制</text><text x="1134" y="453" font-size="13" fill="#475569" font-weight="400">构建、传输与回收增加耗时</text><rect x="1110" y="488" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="1134" y="515" font-size="16" fill="#334155" font-weight="700">一致性与恢复</text><text x="1134" y="540" font-size="13" fill="#475569" font-weight="400">固定镜像、资源和验收脚本</text><text x="1134" y="561" font-size="13" fill="#475569" font-weight="400">区分任务失败与环境错误</text><rect x="1110" y="596" width="380" height="94" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="1134" y="623" font-size="16" fill="#334155" font-weight="700">运维心智负担</text><text x="1134" y="648" font-size="13" fill="#475569" font-weight="400">维护镜像、配额和孤儿资源</text><text x="1134" y="669" font-size="13" fill="#475569" font-weight="400">适合编码及有状态长任务</text><rect x="1110" y="720" width="380" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="1134" y="747" font-size="14" fill="#166534" font-weight="700">适用：环境终态和产物验收</text><text x="1134" y="772" font-size="13" fill="#475569" font-weight="400">补齐：业务轨迹与语义分析</text><text x="800" y="860" font-size="15" fill="#64748b" font-weight="400" text-anchor="middle">组合方式：轻量断言守入口，沙箱验证状态，轨迹平台定位失败</text></g></svg>