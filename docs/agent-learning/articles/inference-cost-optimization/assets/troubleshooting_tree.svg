<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">先定位账单分项，再选择修复动作</title><desc id="d">诊断树是建议的排障顺序；阈值应由本团队的基线与质量预算决定</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#f97316"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">先定位账单分项，再选择修复动作</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">诊断树是建议的排障顺序；阈值应由本团队的基线与质量预算决定</text><rect x="80" y="390" width="250" height="120" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="390" width="250" height="6" rx="3" fill="#3b82f6"/><text x="105" y="433" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">成本或质量异常</text><text x="105" y="466" font-size="13" fill="#475569" font-weight="500" text-anchor="start">先按审查类型分桶</text><text x="105" y="491" font-size="13" fill="#475569" font-weight="500" text-anchor="start">保持任务难度可比</text><path d="M 330 450 H 405 V 240 H 476" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><path d="M 330 450 H 405 V 400 H 476" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><path d="M 330 450 H 405 V 560 H 476" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><path d="M 330 450 H 405 V 720 H 476" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/><rect x="480" y="180" width="380" height="120" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="480" y="180" width="380" height="6" rx="3" fill="#3b82f6"/><text x="505" y="223" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">写入量升高</text><text x="505" y="256" font-size="13" fill="#475569" font-weight="500" text-anchor="start">先比较最终前缀哈希</text><text x="505" y="281" font-size="13" fill="#475569" font-weight="500" text-anchor="start">再查 TTL、隔离域与断点</text><line x1="860" y1="240" x2="1036" y2="240" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><rect x="1040" y="180" width="480" height="120" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1040" y="180" width="480" height="6" rx="3" fill="#3b82f6"/><text x="1065" y="223" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">执行动作</text><text x="1065" y="256" font-size="13" fill="#475569" font-weight="500" text-anchor="start">哈希变化：定位首个差异块</text><text x="1065" y="281" font-size="13" fill="#475569" font-weight="500" text-anchor="start">哈希稳定：检查缓存适用条件</text><rect x="480" y="340" width="380" height="120" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="480" y="340" width="380" height="6" rx="3" fill="#8b5cf6"/><text x="505" y="383" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">读取量升高</text><text x="505" y="416" font-size="13" fill="#475569" font-weight="500" text-anchor="start">首请求命中正常</text><text x="505" y="441" font-size="13" fill="#475569" font-weight="500" text-anchor="start">每单累计读取却增加</text><line x1="860" y1="400" x2="1036" y2="400" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><rect x="1040" y="340" width="480" height="120" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1040" y="340" width="480" height="6" rx="3" fill="#8b5cf6"/><text x="1065" y="383" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">执行动作</text><text x="1065" y="416" font-size="13" fill="#475569" font-weight="500" text-anchor="start">查会话轮数、重复工具读取</text><text x="1065" y="441" font-size="13" fill="#475569" font-weight="500" text-anchor="start">删无用尾轮；限制单次返回量</text><rect x="480" y="500" width="380" height="120" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="480" y="500" width="380" height="6" rx="3" fill="#f97316"/><text x="505" y="543" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">P99 延迟升高</text><text x="505" y="576" font-size="13" fill="#475569" font-weight="500" text-anchor="start">先分解排队与首 token</text><text x="505" y="601" font-size="13" fill="#475569" font-weight="500" text-anchor="start">再看工具与解码耗时</text><line x1="860" y1="560" x2="1036" y2="560" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/><rect x="1040" y="500" width="480" height="120" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1040" y="500" width="480" height="6" rx="3" fill="#f97316"/><text x="1065" y="543" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">执行动作</text><text x="1065" y="576" font-size="13" fill="#475569" font-weight="500" text-anchor="start">排队：限流与公平调度</text><text x="1065" y="601" font-size="13" fill="#475569" font-weight="500" text-anchor="start">首 token：查写入竞争与驱逐</text><rect x="480" y="660" width="380" height="120" rx="16" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="480" y="660" width="380" height="6" rx="3" fill="#ef4444"/><text x="505" y="703" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">重要缺陷召回下降</text><text x="505" y="736" font-size="13" fill="#475569" font-weight="500" text-anchor="start">先核查基准样本与盲审</text><text x="505" y="761" font-size="13" fill="#475569" font-weight="500" text-anchor="start">同时检查版本与难度漂移</text><line x1="860" y1="720" x2="1036" y2="720" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/><rect x="1040" y="660" width="480" height="120" rx="16" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1040" y="660" width="480" height="6" rx="3" fill="#ef4444"/><text x="1065" y="703" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">执行动作</text><text x="1065" y="736" font-size="13" fill="#475569" font-weight="500" text-anchor="start">回滚模型、effort 或上下文裁剪</text><text x="1065" y="761" font-size="13" fill="#475569" font-weight="500" text-anchor="start">保留人工门禁后重新做配对实验</text></g></svg>