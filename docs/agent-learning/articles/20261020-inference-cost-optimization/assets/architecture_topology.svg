<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">把缓存边界、执行边界与质量边界分开</title><desc id="d">依据原文机制重绘；幂等发布与预算门禁为工程建议</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#3b82f6"/></marker><marker id="arr-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#8b5cf6"/></marker><marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#10b981"/></marker><marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#f97316"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#ef4444"/></marker><marker id="arr-slate" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">把缓存边界、执行边界与质量边界分开</text><text x="800" y="115" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">依据原文机制重绘；幂等发布与预算门禁为工程建议</text><rect x="80" y="165" width="440" height="565" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><text x="110" y="210" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">构建可复用上下文</text><rect x="580" y="165" width="440" height="565" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><text x="610" y="210" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">编排专项审查</text><rect x="1080" y="165" width="440" height="565" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1110" y="210" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">执行模型推理</text><rect x="110" y="240" width="380" height="115" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="110" y="240" width="380" height="6" rx="3" fill="#3b82f6"/><text x="135" y="283" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">全局前缀 · 断点一</text><text x="135" y="316" font-size="13" fill="#475569" font-weight="500" text-anchor="start">固定工具定义与规则</text><text x="135" y="341" font-size="13" fill="#475569" font-weight="500" text-anchor="start">同信任域内跨仓库复用</text><rect x="110" y="380" width="380" height="115" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="110" y="380" width="380" height="6" rx="3" fill="#8b5cf6"/><text x="135" y="423" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">变更前缀 · 断点二</text><text x="135" y="456" font-size="13" fill="#475569" font-weight="500" text-anchor="start">固定 base/head 与补丁顺序</text><text x="135" y="481" font-size="13" fill="#475569" font-weight="500" text-anchor="start">同一变更内跨角色复用</text><rect x="110" y="520" width="380" height="115" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="110" y="520" width="380" height="6" rx="3" fill="#f97316"/><text x="135" y="563" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">动态后缀</text><text x="135" y="596" font-size="13" fill="#475569" font-weight="500" text-anchor="start">角色任务、环境与工具结果</text><text x="135" y="621" font-size="13" fill="#475569" font-weight="500" text-anchor="start">不把每次变化插到前缀中</text><text x="110" y="686" font-size="13" fill="#64748b" font-weight="500" text-anchor="start">实际断点须检查最终请求体</text><rect x="610" y="240" width="380" height="115" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="610" y="240" width="380" height="6" rx="3" fill="#8b5cf6"/><text x="635" y="283" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">预取与有界并发</text><text x="635" y="316" font-size="13" fill="#475569" font-weight="500" text-anchor="start">一次读取已知上下文</text><text x="635" y="341" font-size="13" fill="#475569" font-weight="500" text-anchor="start">保留按需检索与预算上限</text><rect x="610" y="380" width="380" height="115" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="610" y="380" width="380" height="6" rx="3" fill="#8b5cf6"/><text x="635" y="423" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">代码质量 / 安全 / 性能</text><text x="635" y="456" font-size="13" fill="#475569" font-weight="500" text-anchor="start">同模型配置才可尝试共享</text><text x="635" y="481" font-size="13" fill="#475569" font-weight="500" text-anchor="start">写入者响应开始后释放屏障</text><rect x="610" y="520" width="380" height="115" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="610" y="520" width="380" height="6" rx="3" fill="#10b981"/><text x="635" y="563" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">发布与终止</text><text x="635" y="596" font-size="13" fill="#475569" font-weight="500" text-anchor="start">唯一发布者持有写权限</text><text x="635" y="621" font-size="13" fill="#475569" font-weight="500" text-anchor="start">提交前校验版本与取消状态</text><text x="610" y="686" font-size="13" fill="#64748b" font-weight="500" text-anchor="start">每次物理请求独立计费与追踪</text><rect x="1110" y="240" width="380" height="115" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1110" y="240" width="380" height="6" rx="3" fill="#10b981"/><text x="1135" y="283" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">前缀匹配与预填充</text><text x="1135" y="316" font-size="13" fill="#475569" font-weight="500" text-anchor="start">命中部分复用已计算状态</text><text x="1135" y="341" font-size="13" fill="#475569" font-weight="500" text-anchor="start">未命中部分仍需执行计算</text><rect x="1110" y="380" width="380" height="115" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1110" y="380" width="380" height="6" rx="3" fill="#10b981"/><text x="1135" y="423" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">KV 复用边界</text><text x="1135" y="456" font-size="13" fill="#475569" font-weight="500" text-anchor="start">托管缓存布局不公开</text><text x="1135" y="481" font-size="13" fill="#475569" font-weight="500" text-anchor="start">自托管受显存与淘汰策略约束</text><rect x="1110" y="520" width="380" height="115" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1110" y="520" width="380" height="6" rx="3" fill="#f97316"/><text x="1135" y="563" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">独立解码输出</text><text x="1135" y="596" font-size="13" fill="#475569" font-weight="500" text-anchor="start">缓存不会复用审查结论</text><text x="1135" y="621" font-size="13" fill="#475569" font-weight="500" text-anchor="start">长输出仍消耗推理与带宽</text><text x="1110" y="686" font-size="13" fill="#64748b" font-weight="500" text-anchor="start">缓存丢失可重算；任务状态需持久化</text><line x1="520" y1="450" x2="576" y2="450" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/><line x1="1020" y1="450" x2="1076" y2="450" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-violet)"/><rect x="80" y="765" width="1440" height="65" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="110" y="805" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">观测与质量门禁</text><text x="350" y="804" font-size="16" fill="#475569" font-weight="500" text-anchor="start">首请求读写量  ·  会话轮数  ·  取消后消耗  ·  P99  ·  已知缺陷召回  ·  人工确认结果</text></g></svg>