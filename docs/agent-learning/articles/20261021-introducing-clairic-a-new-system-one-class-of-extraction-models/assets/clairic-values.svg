<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">Clairic：同一次读取，返回不同性质的值</title>
  <desc id="desc">左侧为原文售后邮件的译述和字段要求，中间表示输入与字段一起计算，右侧分别表示抽取订单号、计算付款总额、对缺失快递单号返回空值、对维修费用作需要额外证据的估计。箭头表示接口的数据关系，并不表示内部网络结构。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #173247; }
      .title { font-size: 30px; font-weight: 650; }
      .sub { font-size: 19px; fill: #526777; }
      .head { font-size: 23px; font-weight: 650; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #526777; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; }
    </style>
  </defs>
  <rect width="1080" height="760" rx="18" fill="#f8fafc"/>
  <text x="36" y="55" class="title">同一次读取，返回不同性质的值</text>
  <text x="36" y="89" class="sub">先区分：输入中已有的事实、可以算出的结果、仍然未知的费用</text>

  <rect x="36" y="130" width="310" height="288" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="58" y="168" class="head">输入：售后邮件</text>
  <text x="58" y="205" class="body">订单 A-88412</text>
  <text x="58" y="240" class="body">9 月 28 日送达</text>
  <text x="58" y="275" class="body">商品 $649.00</text>
  <text x="58" y="310" class="body">税费 $52.10</text>
  <text x="58" y="345" class="body">屏幕破裂、边角凹陷</text>
  <text x="58" y="391" class="small">原文示例译述，并非新增实测</text>

  <rect x="36" y="450" width="310" height="194" rx="12" fill="#edf3f8" stroke="#cbd5e1"/>
  <text x="58" y="489" class="head">字段要求</text>
  <text x="58" y="526" class="body">名称 + 类型 + 说明</text>
  <text x="58" y="561" class="body">例如：含税总额、数值</text>
  <text x="58" y="602" class="small">预测还可指定范围与步长</text>

  <path d="M346 274 H386 V350 H418" class="line"/>
  <path d="M346 548 H386 V426 H418" class="line"/>
  <path d="M418 350 L407 344 V356 Z M418 426 L407 420 V432 Z" fill="#64748b"/>
  <rect x="420" y="305" width="194" height="167" rx="14" fill="#173f54"/>
  <text x="517" y="348" text-anchor="middle" style="font-size:24px;font-weight:650;fill:white">Clairic</text>
  <text x="517" y="385" text-anchor="middle" style="font-size:21px;fill:white">输入与字段</text>
  <text x="517" y="416" text-anchor="middle" style="font-size:21px;fill:white">一起计算</text>
  <text x="517" y="448" text-anchor="middle" style="font-size:17px;fill:#d5e6ee">无需逐字生成答案</text>

  <path d="M614 388 H650" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M650 190 V580" fill="none" stroke="#64748b" stroke-width="2.2"/>
  <path d="M650 190 H688" class="line"/>
  <path d="M650 320 H688" class="line"/>
  <path d="M650 450 H688" class="line"/>
  <path d="M650 580 H688" class="line"/>
  <path d="M688 190 L677 184 V196 Z M688 320 L677 314 V326 Z M688 450 L677 444 V456 Z M688 580 L677 574 V586 Z" fill="#64748b"/>

  <rect x="692" y="130" width="352" height="116" rx="12" fill="#e7f3ef"/>
  <text x="714" y="165" class="head">抽取 → A-88412</text>
  <text x="714" y="198" class="body">附原始文本的起止位置</text>
  <text x="714" y="228" class="small">来自原文，仍可能选错片段</text>

  <rect x="692" y="260" width="352" height="116" rx="12" fill="#e9f1fc"/>
  <text x="714" y="295" class="head">计算 → $701.10</text>
  <text x="714" y="328" class="body">649.00 + 52.10</text>
  <text x="714" y="358" class="small">由输入推导，可用算术核对</text>

  <rect x="692" y="390" width="352" height="116" rx="12" fill="#edf0f4"/>
  <text x="714" y="425" class="head">缺失 → null</text>
  <text x="714" y="458" class="body">输入未提供快递单号</text>
  <text x="714" y="488" class="small">示例中模型选择不返回候选值</text>

  <rect x="692" y="520" width="352" height="124" rx="12" fill="#fff1de"/>
  <text x="714" y="555" class="head">估计 → 维修费用分布</text>
  <text x="714" y="588" class="body">需要型号、报价等证据</text>
  <text x="714" y="620" class="small">返回预测区间 ≠ 已知真实费用</text>

  <text x="36" y="696" class="sub">读图：多个字段可并行回答；字段放不下时，服务会拆成多个计算批次。</text>
  <text x="36" y="728" class="small">依据 Cloudflare 发布说明绘制的接口概念图；不表示已公开内部网络结构。</text>
</svg>
