<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">nesformer：模型计算，宿主连接设备</title>
  <desc id="desc">从左向右阅读。左侧权重规定处理器规则，内部状态保存游戏程序和运行数据；实线向右输出执行记录，右侧宿主绘制画面并读取手柄；虚线向左返回设备读数和中断通知。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/></filter>
    <marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6d28d9"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="800" y="100" text-anchor="middle" font-size="36" font-weight="800" fill="#0f172a">哪些在模型中，哪些交给外部程序？</text>
    <text x="800" y="144" text-anchor="middle" font-size="23" fill="#64748b">先读左侧，再沿实线向右；虚线表示设备返回的信息</text>
    <rect x="80" y="210" width="650" height="500" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="266" font-size="28" font-weight="700" fill="#6d28d9">模型：推进处理器计算</text>
    <rect x="120" y="306" width="570" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="150" y="350" font-size="25" font-weight="700" fill="#0f172a">固定权重：规定怎样算</text>
    <text x="150" y="391" font-size="23" fill="#475569">读取指令 → 计算结果 → 编码下一条记录</text>
    <rect x="120" y="478" width="570" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="150" y="522" font-size="25" font-weight="700" fill="#0f172a">内部状态：保存当前数据</text>
    <text x="150" y="563" font-size="23" fill="#475569">游戏程序、工作内存、寄存器与指令位置</text>
    <text x="120" y="665" font-size="23" fill="#6d28d9">记录送回模型，更新状态，继续执行</text>
    <rect x="1080" y="210" width="440" height="500" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="1120" y="266" font-size="28" font-weight="700" fill="#1d4ed8">宿主：处理外围设备</text>
    <rect x="1120" y="306" width="360" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1150" y="350" font-size="25" font-weight="700" fill="#0f172a">接收执行记录</text>
    <text x="1150" y="391" font-size="23" fill="#475569">绘制画面，处理设备写入</text>
    <rect x="1120" y="478" width="360" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1150" y="522" font-size="25" font-weight="700" fill="#0f172a">准备返回信息</text>
    <text x="1150" y="563" font-size="23" fill="#475569">读取手柄，跟踪刷新时机</text>
    <text x="1120" y="665" font-size="23" fill="#1d4ed8">不负责代算处理器指令</text>
    <line x1="733" y1="375" x2="1075" y2="375" stroke="#6d28d9" stroke-width="3" marker-end="url(#purple)"/>
    <text x="905" y="338" text-anchor="middle" font-size="24" font-weight="700" fill="#6d28d9">执行记录</text>
    <line x1="1077" y1="552" x2="735" y2="552" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8,7" marker-end="url(#blue)"/>
    <text x="905" y="508" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">设备读数 / 中断通知</text>
    <rect x="160" y="760" width="1280" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="800" y="804" text-anchor="middle" font-size="25" fill="#475569">启动时把游戏程序装入内部状态；更换受支持的游戏，不需要重新训练权重</text>
  </g>
</svg>
