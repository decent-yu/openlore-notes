anchor="start">状态与恢复</text><text x="1122" y="509" font-size="14" fill="#475569" font-weight="400" text-anchor="start">评估日志记录轨迹与结果</text><text x="1122" y="532" font-size="14" fill="#475569" font-weight="400" text-anchor="start">外部代理持久化仍由应用负责</text><rect x="1100" y="569" width="400" height="98" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="1122" y="597" font-size="16" fill="#166534" font-weight="700" text-anchor="start">维护代价</text><text x="1122" y="622" font-size="14" fill="#475569" font-weight="400" text-anchor="start">适合自定义研究与重复试验</text><text x="1122" y="645" font-size="14" fill="#475569" font-weight="400" text-anchor="start">需要开发评分器与业务适配层</text><rect x="1100" y="682" width="400" height="98" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="1122" y="710" font-size="16" fill="#166534" font-weight="700" text-anchor="start">适用判断</text><text x="1122" y="735" font-size="14" fill="#475569" font-weight="400" text-anchor="start">复杂任务、重复可靠性实验</text><text x="1122" y="758" font-size="14" fill="#475569" font-weight="400" text-anchor="start">不直接替代生产护栏与审阅台</text></g></svg>