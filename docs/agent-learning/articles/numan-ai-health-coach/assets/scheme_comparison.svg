<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">选型先看评估对象，再看工具入口</title><desc id="d">三者可组合使用；无同口径公开吞吐基准，不作 QPS 排名</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#1d4ed8"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#6d28d9"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#166534"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ea580c"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#dc2626"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">选型先看评估对象，再看工具入口</text><text x="800" y="116" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">三者可组合使用；无同口径公开吞吐基准，不作 QPS 排名</text><rect x="80" y="160" width="440" height="670" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="160" width="440" height="670" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="104" y="204" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">LangGraph + LangSmith</text><rect x="100" y="230" width="400" height="98" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="122" y="258" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">核心机制</text><text x="122" y="283" font-size="14" fill="#475569" font-weight="400" text-anchor="start">图执行 + Trace / 数据集实验</text><rect x="100" y="343" width="400" height="98" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="122" y="371" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">吞吐与延迟</text><text x="122" y="396" font-size="14" fill="#475569" font-weight="400" text-anchor="start">并发受模型配额与图调用量约束</text><text x="122" y="419" font-size="14" fill="#475569" font-weight="400" text-anchor="start">输出护栏位于在线关键路径</text><rect x="100" y="456" width="400" height="98" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="122" y="484" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">状态与恢复</text><text x="122" y="509" font-size="14" fill="#475569" font-weight="400" text-anchor="start">运行图检查点保存对话状态</text><text x="122" y="532" font-size="14" fill="#475569" font-weight="400" text-anchor="start">实验 ID 关联版本与分类结果</text><rect x="100" y="569" width="400" height="98" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="122" y="597" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">维护代价</text><text x="122" y="622" font-size="14" fill="#475569" font-weight="400" text-anchor="start">整合评审与观测入口</text><text x="122" y="645" font-size="14" fill="#475569" font-weight="400" text-anchor="start">需治理追踪数据与环境权限</text><rect x="100" y="682" width="400" height="98" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="122" y="710" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">适用判断</text><text x="122" y="735" font-size="14" fill="#475569" font-weight="400" text-anchor="start">已有图代理与日常人工评审</text><text x="122" y="758" font-size="14" fill="#475569" font-weight="400" text-anchor="start">不适合只需一次性轻量扫描</text><rect x="580" y="160" width="440" height="670" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="580" y="160" width="440" height="670" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="604" y="204" font-size="22" fill="#6d28d9" font-weight="700" text-anchor="start">promptfoo</text><rect x="600" y="230" width="400" height="98" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="622" y="258" font-size="16" fill="#6d28d9" font-weight="700" text-anchor="start">核心机制</text><text x="622" y="283" font-size="14" fill="#475569" font-weight="400" text-anchor="start">通过目标接口执行断言与红队</text><rect x="600" y="343" width="400" height="98" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="622" y="371" font-size="16" fill="#6d28d9" font-weight="700" text-anchor="start">吞吐与延迟</text><text x="622" y="396" font-size="14" fill="#475569" font-weight="400" text-anchor="start">多轮攻击逐轮调用目标</text><text x="622" y="419" font-size="14" fill="#475569" font-weight="400" text-anchor="start">增加轮数 / 回溯会增加成本</text><rect x="600" y="456" width="400" height="98" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="622" y="484" font-size="16" fill="#6d28d9" font-weight="700" text-anchor="start">状态与恢复</text><text x="622" y="509" font-size="14" fill="#475569" font-weight="400" text-anchor="start">完整历史重放或服务端会话</text><text x="622" y="532" font-size="14" fill="#475569" font-weight="400" text-anchor="start">隔离与重置由目标适配层保证</text><rect x="600" y="569" width="400" height="98" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="622" y="597" font-size="16" fill="#