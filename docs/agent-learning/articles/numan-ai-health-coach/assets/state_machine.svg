<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d"><title id="t">护栏是带预算的状态机</title><desc id="d">原文确认审核、重生成和兜底；异常处理与幂等约束为工程建议</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#1d4ed8"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#6d28d9"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#166534"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ea580c"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#dc2626"/></marker><marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="800" y="80" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">护栏是带预算的状态机</text><text x="800" y="116" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">原文确认审核、重生成和兜底；异常处理与幂等约束为工程建议</text><rect x="80" y="190" width="300" height="125" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="190" width="300" height="125" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="104" y="228" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">隔离会话与锁定版本</text><text x="104" y="260" font-size="16" fill="#475569" font-weight="400" text-anchor="start">应用、标准、护栏分别标识</text><text x="104" y="286" font-size="16" fill="#475569" font-weight="400" text-anchor="start">同一会话串行处理</text><rect x="470" y="190" width="300" height="125" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="470" y="190" width="300" height="125" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="494" y="228" font-size="21" fill="#6d28d9" font-weight="700" text-anchor="start">监督与专家生成草稿</text><text x="494" y="260" font-size="14" fill="#475569" font-weight="400" text-anchor="start">工具失败走独立异常分支</text><text x="494" y="286" font-size="14" fill="#475569" font-weight="400" text-anchor="start">草稿不能直接对用户流式发送</text><rect x="860" y="190" width="300" height="125" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="860" y="190" width="300" height="125" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="884" y="228" font-size="21" fill="#166534" font-weight="700" text-anchor="start">安全护栏判定</text><text x="884" y="260" font-size="16" fill="#475569" font-weight="400" text-anchor="start">通过 / 违规 / 判定不可用</text><text x="884" y="286" font-size="16" fill="#475569" font-weight="400" text-anchor="start">记录规则 ID 与证据</text><rect x="1250" y="190" width="270" height="125" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1250" y="190" width="270" height="125" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="1274" y="228" font-size="21" fill="#166534" font-weight="700" text-anchor="start">通过后交付</text><text x="1274" y="260" font-size="14" fill="#475569" font-weight="400" text-anchor="start">客户端仅接收已放行输出</text><text x="1274" y="286" font-size="14" fill="#475569" font-weight="400" text-anchor="start">保留关联审计 ID</text><path d="M384 252 H466" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/><polygon points="466.0,252.0 448.5,260.75 448.5,243.25" fill="#1d4ed8"/><path d="M774 252 H856" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-violet)"/><polygon points="856.0,252.0 838.5,260.75 838.5,243.25" fill="#6d28d9"/><path d="M1164 252 H1246" fill="none" stroke="#166534" stroke-width="2.5" marker-end="url(#arrow-green)"/><polygon points="1246.0,252.0 1228.5,260.75 1228.5,243.25" fill="#166534"/><text x="1205" y="238" font-size="14" fill="#166534" font-weight="600" text-anchor="middle">通过</text><rect x="860" y="420" width="300" height="140" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="860" y="420" width="300" height="140" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="884" y="458" font-size="21" fill="#ea580c" font-weight="700" text-anchor="start">违规：检查重试预算</text><text x="884" y="490" font-size="16" fill="#475569" font-weight="400" text-anchor="start">未超限：返回监督节点</text><text x="884" y="516" font-size="16" fill="#475569" font-weight="400" text-anchor="start">超限：使用审核过的兜底</text><text x="884" y="542" font-size="16" fill="#475569" font-weight="400" text-anchor="start">重试计数随会话状态保存</text><path d="M1010 319 V416" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/><polygon points="1010.0,416.0 1001.25,398.5 1018.75,398.5" fill="#ea580c"/><text x="1030" y="372" font-size="14" fill="#ea580c" font-weight="600" text-anchor="start">违规</text><path d="M856 490 H620 V319" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="6,6"/><polygon points="620.0,319.0 628.75,336.5 611.25,336.5" fill="#ea580c"/><text x="720" y="473" font-size="14" fill="#ea580c" font-weight="600" text-anchor="middle">预算内重生成</text><rect x="1250" y="420" width="270" height="140" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="1250" y="420" width="270" height="140" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="1274" y="458" font-size="21" fill="#dc2626" font-weight="700" text-anchor="start">超时或判定不可用</text><text x="1274" y="490" font-size="14" fill="#475569" font-weight="400" text-anchor="start">停止草稿交付</text><text x="1274" y="516" font-size="14" fill="#475569" font-weight="400" text-anchor="start">确定性兜底 / 人工通道</text><text x="1274" y="542" font-size="14" fill="#475569" font-weight="400" text-anchor="start">模型重试与内容重试分开</text><path d="M1140 319 V365 H1385 V416" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/><polygon points="1385.0,416.0 1376.25,398.5 1393.75,398.5" fill="#dc2626"/><text x="1300" y="354" font-size="14" fill="#dc2626" font-weight="600" text-anchor="middle">异常</text><rect x="860" y="675" width="660" height="140" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="860" y="675" width="660" height="140" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="884" y="713" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">安全终态与复核队列</text><text x="884" y="745" font-size="16" fill="#475569" font-weight="400" text-anchor="start">违规超限、护栏异常均收敛至已审核模板</text><text x="884" y="771" font-size="16" fill="#475569" font-weight="400" text-anchor="start">保存原因、尝试次数与完整轨迹，进入人工复核</text><text x="884" y="797" font-size="16" fill="#475569" font-weight="400" text-anchor="start">原文未披露具体重试次数；此图展示建议实现</text><path d="M1010 564 V671" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/><polygon points="1010.0,671.0 1001.25,653.5 1018.75,653.5" fill="#ea580c"/><path d="M1385 564 V671" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/><polygon points="1385.0,671.0 1376.25,653.5 1393.75,653.5" fill="#dc2626"/><rect x="80" y="420" width="380" height="395" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/><rect x="80" y="420" width="380" height="395" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="104" y="458" font-size="21" fill="#475569" font-weight="700" text-anchor="start">重放必须保持三个不变量</text><text x="104" y="490" font-size="16" fill="#475569" font-weight="400" text-anchor="start">① 相同 thread_id 的顺序可解释</text><text x="104" y="516" font-size="16" fill="#475569" font-weight="400" text-anchor="start">② 消息身份与工具结果可关联</text><text x="104" y="542" font-size="16" fill="#475569" font-weight="400" text-anchor="start">③ 外部副作用使用幂等键</text><text x="104" y="568" font-size="16" fill="#475569" font-weight="400" text-anchor="start"></text><text x="104" y="594" font-size="16" fill="#475569" font-weight="400" text-anchor="start">检查点保证状态恢复能力</text><text x="104" y="620" font-size="16" fill="#475569" font-weight="400" text-anchor="start">不自动保证外部动作恰好执行一次</text><text x="104" y="646" font-size="16" fill="#475569" font-weight="400" text-anchor="start"></text><text x="104" y="672" font-size="16" fill="#475569" font-weight="400" text-anchor="start">并发写入与崩溃恢复分别验收</text></g></svg>