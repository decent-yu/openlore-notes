<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">撤权全部确认，才能结束复核并归档</title><desc id="d">待审复核可经授权决策或期限触发执行。部分失败只重试余项，永久异常转人工，归档必须等待撤权与回执完成。</desc><defs>
<linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
<filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#3b82f6"/></marker>
<marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#8b5cf6"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#ea580c"/></marker>
<marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#dc2626"/></marker>
<marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
</defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="800" y="83" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">撤权全部确认，才能结束复核并归档</text>
<text x="800" y="118" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">实线为执行推进；虚线为重试或纠正；橙色门禁为本文建议</text>
<rect x="80" y="195" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="80" y="195" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="80" y="195" width="340" height="135" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="104" y="229" font-size="21" fill="#3b82f6" font-weight="700" text-anchor="start">待审复核</text>
<text x="104" y="261" font-size="18" fill="#475569" font-weight="400" text-anchor="start">保存快照与最早期限</text>
<text x="104" y="288" font-size="18" fill="#475569" font-weight="400" text-anchor="start">绑定 Issue 和周期</text>
<rect x="630" y="195" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="630" y="195" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="630" y="195" width="340" height="135" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="654" y="229" font-size="21" fill="#8b5cf6" font-weight="700" text-anchor="start">执行移除</text>
<text x="654" y="261" font-size="18" fill="#475569" font-weight="400" text-anchor="start">授权决策或可信逾期</text>
<text x="654" y="288" font-size="18" fill="#475569" font-weight="400" text-anchor="start">逐用户记录执行结果</text>
<rect x="1180" y="195" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="1180" y="195" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="1180" y="195" width="340" height="135" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="1204" y="229" font-size="21" fill="#16a34a" font-weight="700" text-anchor="start">完成复核</text>
<text x="1204" y="261" font-size="18" fill="#475569" font-weight="400" text-anchor="start">全部操作已回读确认</text>
<text x="1204" y="288" font-size="18" fill="#475569" font-weight="400" text-anchor="start">保存状态与审计回执</text>
<rect x="630" y="450" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="630" y="450" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="630" y="450" width="340" height="135" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="654" y="484" font-size="21" fill="#ea580c" font-weight="700" text-anchor="start">部分失败</text>
<text x="654" y="516" font-size="18" fill="#475569" font-weight="400" text-anchor="start">保持 pending / 待处理</text>
<text x="654" y="543" font-size="18" fill="#475569" font-weight="400" text-anchor="start">仅重试未确认的操作</text>
<rect x="80" y="450" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="80" y="450" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="80" y="450" width="340" height="135" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="104" y="484" font-size="21" fill="#dc2626" font-weight="700" text-anchor="start">人工异常队列</text>
<text x="104" y="516" font-size="18" fill="#475569" font-weight="400" text-anchor="start">解析失败或授权源改变</text>
<text x="104" y="543" font-size="18" fill="#475569" font-weight="400" text-anchor="start">禁止冒充“无人回应”</text>
<rect x="1180" y="450" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="1180" y="450" width="340" height="135" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="1180" y="450" width="340" height="135" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="1204" y="484" font-size="21" fill="#ea580c" font-weight="700" text-anchor="start">归档门禁</text>
<text x="1204" y="516" font-size="18" fill="#475569" font-weight="400" text-anchor="start">无待执行项且回执已存</text>
<text x="1204" y="543" font-size="18" fill="#475569" font-weight="400" text-anchor="start">重新检查人类活动</text>
<rect x="1180" y="695" width="340" height="125" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="1180" y="695" width="340" height="125" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
<rect x="1180" y="695" width="340" height="125" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="1204" y="729" font-size="21" fill="#16a34a" font-weight="700" text-anchor="start">已归档</text>
<text x="1204" y="761" font-size="18" fill="#475569" font-weight="400" text-anchor="start">权限与 Issue 只读</text>
<text x="1204" y="788" font-size="18" fill="#475569" font-weight="400" text-anchor="start">修改前需要解除归档</text>
<line x1="424" y1="260" x2="626" y2="260" stroke="#3b82f6" stroke-width="2.5"/>
<polygon points="626,260 617.00,255.50 617.00,264.50" fill="#3b82f6"/>
<text x="525" y="239" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">授权通过 / 到期</text>
<line x1="974" y1="260" x2="1176" y2="260" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="1176,260 1167.00,255.50 1167.00,264.50" fill="#16a34a"/>
<text x="1075" y="239" font-size="17" fill="#166534" font-weight="400" text-anchor="middle">全部成功</text>
<line x1="800" y1="334" x2="800" y2="446" stroke="#ea580c" stroke-width="2.5"/>
<polygon points="800,446 804.50,437.00 795.50,437.00" fill="#ea580c"/>
<text x="826" y="395" font-size="17" fill="#ea580c" font-weight="400" text-anchor="start">暂态错误</text>
<path d="M970 520 H1060 V345 H935 V334" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 6"/>
<polygon points="935.0,334.0 930.50,343.00 939.50,343.00" fill="#ea580c"/>
<text x="1030" y="430" font-size="17" fill="#ea580c" font-weight="400" text-anchor="middle">退避后重试</text>
<line x1="626" y1="520" x2="424" y2="520" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="424,520 433.00,524.50 433.00,515.50" fill="#dc2626"/>
<text x="525" y="498" font-size="17" fill="#dc2626" font-weight="400" text-anchor="middle">永久异常</text>
<path d="M250 446 V380 H120 V334" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 6"/>
<polygon points="120.0,334.0 115.50,343.00 124.50,343.00" fill="#3b82f6"/>
<text x="280" y="396" font-size="17" fill="#1d4ed8" font-weight="400" text-anchor="start">纠正后重审</text>
<line x1="1350" y1="334" x2="1350" y2="446" stroke="#ea580c" stroke-width="2.5"/>
<polygon points="1350,446 1354.50,437.00 1345.50,437.00" fill="#ea580c"/>
<text x="1380" y="395" font-size="17" fill="#ea580c" font-weight="400" text-anchor="start">再判定</text>
<line x1="1350" y1="589" x2="1350" y2="691" stroke="#16a34a" stroke-width="2.5"/>
<polygon points="1350,691 1354.50,682.00 1345.50,682.00" fill="#16a34a"/>
<text x="1380" y="651" font-size="17" fill="#166534" font-weight="400" text-anchor="start">通过</text>
<rect x="80" y="680" width="950" height="140" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="110" y="720" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">需要守住的三个不变量</text>
<text x="110" y="758" font-size="20" fill="#475569" font-weight="400" text-anchor="start">超时清理不得早于期限；移除未确认不标完成；归档不得阻断待撤权限。</text>
<text x="110" y="792" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">提示：原文未披露两条治理流程是否互斥，归档冲突属于待验证风险。</text>
</g></svg>