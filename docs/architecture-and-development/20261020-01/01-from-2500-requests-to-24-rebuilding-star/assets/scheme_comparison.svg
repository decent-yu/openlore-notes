<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">四种方案把成本放在不同位置</title><desc id="desc">机制对照：SQL 范围聚合、游标扫描、TimescaleDB 连续聚合、ClickHouse 增量视图</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#3b82f6"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#8b5cf6"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#10b981"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f97316"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ef4444"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, Microsoft YaHei, sans-serif"><text x="800" y="83" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">四种方案把成本放在不同位置</text><text x="800" y="120" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">机制对照：SQL 范围聚合、游标扫描、TimescaleDB 连续聚合、ClickHouse 增量视图</text><rect x="80" y="175" width="345" height="590" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="220" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">范围聚合</text><text x="104" y="265" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">输入裁剪</text><text x="104" y="294" font-size="18" fill="#475569" font-weight="400" text-anchor="start">仓库等值 + 时间范围</text><text x="104" y="342" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">计算成本</text><text x="104" y="371" font-size="18" fill="#475569" font-weight="400" text-anchor="start">每页读取 nᵢ 条明细</text><text x="104" y="419" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">一致性</text><text x="104" y="448" font-size="18" fill="#475569" font-weight="400" text-anchor="start">依赖单次查询快照</text><text x="104" y="496" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">主要边界</text><text x="104" y="525" font-size="18" fill="#475569" font-weight="400" text-anchor="start">高密度周仍昂贵</text><text x="104" y="573" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">团队负担</text><text x="104" y="602" font-size="18" fill="#475569" font-weight="400" text-anchor="start">维护查询与复合索引</text><text x="104" y="650" font-size="15" fill="#3b82f6" font-weight="700" text-anchor="start">适用结论</text><text x="104" y="679" font-size="18" fill="#475569" font-weight="400" text-anchor="start">适合少量趋势看板</text><rect x="445" y="175" width="345" height="590" rx="16" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="469" y="220" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">游标明细</text><text x="469" y="265" font-size="15" fill="#64748b" font-weight="700" text-anchor="start">输入裁剪</text><text x="469" y="294" font-size="18" fill="#475569" font-weight="400" text-anchor="start">时间 + ID 稳定游标</text><text x="469" y="342" font-size="15" fill="#64748b" font-weight="700" text-anchor="start">计算成本</text><text x="469" y="371" font-size="18" fill="#475569" font-weight="400" text-anchor="start">全量仍需读取 N 条</text><text x="469" y="419" font-size="15" fill="#64748b" font-weight="700" text-anchor="start">一致性</text><text x="469" y="448" font-size="18" fill="#475569" font-weight="400" text-anchor="start">跨页需锚点与对账</text><text x="469" y="496" font-size="15" fill="#64748b" font-weight="700" text-anchor="start">主要边界</text><text x="469" y="525" font-size="18" fill="#475569" font-weight="400" text-anchor="start">可避免大 OFFSET</text><text x="469" y="573" font-size="15" fill="#64748b" font-weight="700" text-anchor="start">团队负担</text><text x="469" y="602" font-size="18" fill="#475569" font-weight="400" text-anchor="start">调用端承担累计计数</text><text x="469" y="650" font-size="15" fill="#64748b" font-weight="700" text-anchor="start">适用结论</text><text x="469" y="679" font-size="18" fill="#475569" font-weight="400" text-anchor="start">适合授权明细导出</text><rect x="810" y="175" width="345" height="590" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="834" y="220" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">连续聚合</text><text x="834" y="265" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">输入裁剪</text><text x="834" y="294" font-size="18" fill="#475569" font-weight="400" text-anchor="start">记录失效区间后刷新</text><text x="834" y="342" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">计算成本</text><text x="834" y="371" font-size="18" fill="#475569" font-weight="400" text-anchor="start">查询读取 B 个桶</text><text x="834" y="419" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">一致性</text><text x="834" y="448" font-size="18" fill="#475569" font-weight="400" text-anchor="start">刷新窗口决定新鲜度</text><text x="834" y="496" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">主要边界</text><text x="834" y="525" font-size="18" fill="#475569" font-weight="400" text-anchor="start">历史删除需补刷新</text><text x="834" y="573" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">团队负担</text><text x="834" y="602" font-size="18" fill="#475569" font-weight="400" text-anchor="start">维护调度、失效日志</text><text x="834" y="650" font-size="15" fill="#8b5cf6" font-weight="700" text-anchor="start">适用结论</text><text x="834" y="679" font-size="18" fill="#475569" font-weight="400" text-anchor="start">适合反复查询可变数据</text><rect x="1175" y="175" width="345" height="590" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1199" y="220" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">增量视图</text><text x="1199" y="265" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">输入裁剪</text><text x="1199" y="294" font-size="18" fill="#475569" font-weight="400" text-anchor="start">插入块聚合至目标表</text><text x="1199" y="342" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">计算成本</text><text x="1199" y="371" font-size="18" fill="#475569" font-weight="400" text-anchor="start">写入计算 + 小表读取</text><text x="1199" y="419" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">一致性</text><text x="1199" y="448" font-size="18" fill="#475569" font-weight="400" text-anchor="start">源表删除不自动传播</text><text x="1199" y="496" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">主要边界</text><text x="1199" y="525" font-size="18" fill="#475569" font-weight="400" text-anchor="start">需撤销事件或重建</text><text x="1199" y="573" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">团队负担</text><text x="1199" y="602" font-size="18" fill="#475569" font-weight="400" text-anchor="start">维护回填与去重协议</text><text x="1199" y="650" font-size="15" fill="#10b981" font-weight="700" text-anchor="start">适用结论</text><text x="1199" y="679" font-size="18" fill="#475569" font-weight="400" text-anchor="start">适合追加型分析流</text><rect x="80" y="795" width="1440" height="45" rx="16" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.5"/><text x="800" y="824" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">nᵢ：单页命中明细数　N：全部明细数　B：汇总桶数　｜　未发现同口径生产 QPS 对照</text></g></svg>