<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">先辨认故障，再选择降级动作</title><desc id="desc">适用于小团队的排障决策树；权限错误与真实零计数必须分开处理</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#3b82f6"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#8b5cf6"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#10b981"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f97316"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ef4444"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, Microsoft YaHei, sans-serif"><text x="800" y="83" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">先辨认故障，再选择降级动作</text><text x="800" y="120" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">适用于小团队的排障决策树；权限错误与真实零计数必须分开处理</text><rect x="550" y="170" width="500" height="115" rx="16" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="574" y="209" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">趋势接口异常</text><text x="574" y="246" font-size="18" fill="#475569" font-weight="400" text-anchor="start">先区分响应失败与曲线错误</text><rect x="80" y="365" width="420" height="125" rx="16" fill="#fff7ed" stroke="#f97316" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="404" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">没有可用响应</text><text x="104" y="441" font-size="18" fill="#475569" font-weight="400" text-anchor="start">检查状态码、限流头与网络</text><rect x="590" y="365" width="420" height="125" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="614" y="404" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">响应慢或超时</text><text x="614" y="441" font-size="18" fill="#475569" font-weight="400" text-anchor="start">检查计划与实际扫描行数</text><rect x="1100" y="365" width="420" height="125" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1124" y="404" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">响应快但曲线错误</text><text x="1124" y="441" font-size="18" fill="#475569" font-weight="400" text-anchor="start">检查语义、边界与完整性</text><path d="M 650 285 V 325 H 290 V 361" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/><line x1="800" y1="285" x2="800" y2="361" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-violet)"/><path d="M 950 285 V 325 H 1310 V 361" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/><rect x="80" y="560" width="420" height="200" rx="16" fill="#fff7ed" stroke="#f97316" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="599" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">错误处置</text><text x="104" y="636" font-size="18" fill="#475569" font-weight="400" text-anchor="start">403：鉴别权限与限流</text><text x="104" y="665" font-size="18" fill="#475569" font-weight="400" text-anchor="start">422：检查参数及滥用信号</text><text x="104" y="694" font-size="18" fill="#475569" font-weight="400" text-anchor="start">5xx：有预算地退避重试</text><text x="104" y="723" font-size="18" fill="#475569" font-weight="400" text-anchor="start">保留旧快照并显示采集失败</text><rect x="590" y="560" width="420" height="200" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="614" y="599" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">计划分支</text><text x="614" y="636" font-size="18" fill="#475569" font-weight="400" text-anchor="start">全扫：改索引与原始时间谓词</text><text x="614" y="665" font-size="18" fill="#475569" font-weight="400" text-anchor="start">局部扫描仍慢：缩窗、限并发</text><text x="614" y="694" font-size="18" fill="#475569" font-weight="400" text-anchor="start">检查磁盘读与临时文件</text><text x="614" y="723" font-size="18" fill="#475569" font-weight="400" text-anchor="start">超预算再评估预聚合</text><rect x="1100" y="560" width="420" height="200" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1124" y="599" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">正确性分支</text><text x="1124" y="636" font-size="18" fill="#475569" font-weight="400" text-anchor="start">少周：检查中途失败与翻页</text><text x="1124" y="665" font-size="18" fill="#475569" font-weight="400" text-anchor="start">错日：检查服务端分桶边界</text><text x="1124" y="694" font-size="18" fill="#475569" font-weight="400" text-anchor="start">旧桶变化：检查取消收藏</text><text x="1124" y="723" font-size="18" fill="#475569" font-weight="400" text-anchor="start">需求为净增长：改用事件模型</text><line x1="290" y1="490" x2="290" y2="556" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/><line x1="800" y1="490" x2="800" y2="556" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-violet)"/><line x1="1310" y1="490" x2="1310" y2="556" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/><text x="800" y="824" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">巡检指标：P95 / P99、扫描行数、缓冲读、完整周数、失败率、快照年龄；阈值由本地试验确定</text></g></svg>