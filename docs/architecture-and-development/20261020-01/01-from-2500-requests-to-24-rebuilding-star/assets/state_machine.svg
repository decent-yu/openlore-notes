<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">取消收藏会改写过去的曲线</title><desc id="desc">基于原文当前关系模型推导；缓存失效为本文建议，并非 GitHub 已公开实现</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#3b82f6"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#8b5cf6"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#10b981"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f97316"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ef4444"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, Microsoft YaHei, sans-serif"><text x="800" y="83" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">取消收藏会改写过去的曲线</text><text x="800" y="120" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">基于原文当前关系模型推导；缓存失效为本文建议，并非 GitHub 已公开实现</text><rect x="80" y="190" width="400" height="160" rx="16" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="229" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">未收藏</text><text x="104" y="266" font-size="18" fill="#475569" font-weight="400" text-anchor="start">当前关系表：无记录</text><text x="104" y="295" font-size="18" fill="#475569" font-weight="400" text-anchor="start">历史桶：不贡献计数</text><rect x="600" y="190" width="400" height="160" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="624" y="229" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">已收藏</text><text x="624" y="266" font-size="18" fill="#475569" font-weight="400" text-anchor="start">插入关系：created_at = t₁</text><text x="624" y="295" font-size="18" fill="#475569" font-weight="400" text-anchor="start">查询时贡献到 t₁ 所在日</text><line x1="480" y1="270" x2="596" y2="270" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/><text x="540" y="247" font-size="16" fill="#3b82f6" font-weight="500" text-anchor="middle">添加 star</text><rect x="1120" y="190" width="400" height="160" rx="16" fill="#fff7ed" stroke="#f97316" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1144" y="229" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">已取消</text><text x="1144" y="266" font-size="18" fill="#475569" font-weight="400" text-anchor="start">删除当前关系</text><text x="1144" y="295" font-size="18" fill="#475569" font-weight="400" text-anchor="start">t₁ 对应旧桶减少 1</text><line x1="1000" y1="270" x2="1116" y2="270" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/><text x="1060" y="247" font-size="16" fill="#f97316" font-weight="500" text-anchor="middle">取消 star</text><rect x="600" y="470" width="400" height="170" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="624" y="509" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">再次收藏</text><text x="624" y="546" font-size="18" fill="#475569" font-weight="400" text-anchor="start">新记录：created_at = t₂</text><text x="624" y="575" font-size="18" fill="#475569" font-weight="400" text-anchor="start">贡献转到 t₂ 所在日</text><text x="624" y="604" font-size="18" fill="#475569" font-weight="400" text-anchor="start">旧创建时间无法从现表恢复</text><path d="M 1320 350 V 555 H 1004" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-violet)"/><text x="1170" y="538" font-size="16" fill="#8b5cf6" font-weight="500" text-anchor="middle">再次添加 star</text><rect x="80" y="470" width="400" height="170" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="509" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">缓存与物化视图</text><text x="104" y="546" font-size="18" fill="#475569" font-weight="400" text-anchor="start">历史桶也可能变化</text><text x="104" y="575" font-size="18" fill="#475569" font-weight="400" text-anchor="start">不能只更新最近一周</text><text x="104" y="604" font-size="18" fill="#475569" font-weight="400" text-anchor="start">旧桶需失效或定期对账</text><path d="M 1320 350 V 405 H 280 V 466" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,6" marker-end="url(#arrow-red)"/><text x="800" y="395" font-size="16" fill="#ef4444" font-weight="500" text-anchor="middle">取消操作也会修改过去的桶</text><rect x="80" y="700" width="1440" height="130" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="739" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">数据生命周期决定图表含义</text><text x="104" y="776" font-size="18" fill="#475569" font-weight="400" text-anchor="start">当前关系分桶描述存量来源</text><text x="104" y="805" font-size="18" fill="#475569" font-weight="400" text-anchor="start">历史净增长需另存事件或总量快照</text></g></svg>