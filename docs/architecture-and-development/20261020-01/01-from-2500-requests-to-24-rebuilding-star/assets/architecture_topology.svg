<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">把分页边界推进聚合之前</title><desc id="desc">原文事实与建议实现分层展示；不把开源数据库机制当作 GitHub 内部实现</desc><defs><linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient><filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/></filter><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#3b82f6"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#8b5cf6"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#10b981"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#f97316"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#ef4444"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,7 3.5,0 7" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="url(#bg-canvas)"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, Microsoft YaHei, sans-serif"><text x="800" y="83" font-size="34" fill="#0f172a" font-weight="800" text-anchor="middle">把分页边界推进聚合之前</text><text x="800" y="120" font-size="16" fill="#64748b" font-weight="400" text-anchor="middle">原文事实与建议实现分层展示；不把开源数据库机制当作 GitHub 内部实现</text><rect x="80" y="170" width="1440" height="500" rx="16" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="110" y="211" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">已公开机制：先过滤，再聚合</text><rect x="110" y="250" width="280" height="180" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="134" y="289" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">趋势消费者</text><text x="134" y="326" font-size="18" fill="#475569" font-weight="400" text-anchor="start">请求 page / per_page</text><text x="134" y="355" font-size="18" fill="#475569" font-weight="400" text-anchor="start">每页至多 30 周</text><text x="134" y="384" font-size="18" fill="#475569" font-weight="400" text-anchor="start">响应不含用户身份</text><rect x="460" y="250" width="280" height="180" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="484" y="289" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">API 范围计算</text><text x="484" y="326" font-size="18" fill="#475569" font-weight="400" text-anchor="start">页码映射日历周</text><text x="484" y="355" font-size="18" fill="#475569" font-weight="400" text-anchor="start">生成起止时间</text><text x="484" y="384" font-size="18" fill="#475569" font-weight="400" text-anchor="start">空周补零、倒序输出</text><rect x="810" y="250" width="280" height="180" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="834" y="289" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">当前 star 关系</text><text x="834" y="326" font-size="18" fill="#475569" font-weight="400" text-anchor="start">按仓库与日期过滤</text><text x="834" y="355" font-size="18" fill="#475569" font-weight="400" text-anchor="start">范围内计数、按日分桶</text><text x="834" y="384" font-size="18" fill="#475569" font-weight="400" text-anchor="start">取消 star 后记录删除</text><rect x="1160" y="250" width="330" height="180" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="1184" y="289" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">周桶响应</text><text x="1184" y="326" font-size="18" fill="#475569" font-weight="400" text-anchor="start">week / total / days[7]</text><text x="1184" y="355" font-size="18" fill="#475569" font-weight="400" text-anchor="start">每天为当前存量的创建数</text><text x="1184" y="384" font-size="18" fill="#475569" font-weight="400" text-anchor="start">并非历史净增长</text><line x1="390" y1="340" x2="456" y2="340" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/><line x1="740" y1="340" x2="806" y2="340" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow-violet)"/><line x1="1090" y1="340" x2="1156" y2="340" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/><rect x="110" y="480" width="650" height="150" rx="16" fill="#fff7ed" stroke="#f97316" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="134" y="519" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">成本边界</text><text x="134" y="556" font-size="18" fill="#475569" font-weight="400" text-anchor="start">输出至多 210 个日计数</text><text x="134" y="585" font-size="18" fill="#475569" font-weight="400" text-anchor="start">输入行数仍随周内密度变化</text><text x="134" y="614" font-size="18" fill="#475569" font-weight="400" text-anchor="start">爆发周仍可能触发慢查询</text><rect x="800" y="480" width="690" height="150" rx="16" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="824" y="519" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">实现证据边界</text><text x="824" y="556" font-size="18" fill="#475569" font-weight="400" text-anchor="start">服务端源码与 DDL 未公开</text><text x="824" y="585" font-size="18" fill="#475569" font-weight="400" text-anchor="start">锁策略与执行计划未公开</text><text x="824" y="614" font-size="18" fill="#475569" font-weight="400" text-anchor="start">索引形状仅为本文建议</text><rect x="80" y="720" width="1440" height="110" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-opacity="0.38" stroke-width="1.5" filter="url(#card-shadow)"/><text x="104" y="759" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">建议实现：单个关系数据库起步</text><text x="104" y="796" font-size="18" fill="#475569" font-weight="400" text-anchor="start">复合索引 (repo_id, created_at)；半开区间过滤；按日聚合</text></g></svg>