<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" role="img" aria-labelledby="title desc">
<title id="title">同意检查必须覆盖开户路径</title><desc id="desc">上半部分说明原文中的路径问题和韩国方案，下半部分说明本文建议的保留第三方认证方案。后者需要在创建可用账户前检查同意，不代表 Cloudflare 内部实现。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526777" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="740" fill="#f7f9fc"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#193244">
<text x="40" y="48" font-size="28" font-weight="700">身份确认与业务同意，是两个步骤</text>
<text x="40" y="80" font-size="17" fill="#536777">箭头表示处理顺序；上半部基于原文，下半部为本文建议。</text>
<rect x="30" y="106" width="1020" height="286" rx="14" fill="#fff" stroke="#d7e1eb"/>
<text x="52" y="139" font-size="21" font-weight="700">原文中的问题与选择</text>
<g stroke="#526777" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M256 205H328"/><path d="M650 205H792"/><path d="M256 305H792"/></g>
<rect x="52" y="174" width="204" height="62" rx="8" fill="#e8eff8"/><text x="154" y="212" font-size="19" text-anchor="middle">自有注册入口</text>
<rect x="328" y="174" width="322" height="62" rx="8" fill="#ddf3ec"/><text x="489" y="212" font-size="19" text-anchor="middle">分项展示 → 用户同意</text>
<rect x="792" y="174" width="228" height="62" rx="8" fill="#e8eff8"/><text x="906" y="212" font-size="19" text-anchor="middle">创建账户</text>
<rect x="52" y="274" width="204" height="62" rx="8" fill="#fbe7e5"/><text x="154" y="312" font-size="19" text-anchor="middle">第三方认证返回</text>
<rect x="350" y="279" width="356" height="50" rx="6" fill="#fff"/><text x="528" y="310" font-size="18" text-anchor="middle" fill="#a34137">原有路径跳过自有同意表单</text>
<text x="52" y="368" font-size="18" fill="#245c50">Cloudflare 的韩国方案：关闭第三方注册入口，让新用户经过上方表单。</text>
<rect x="30" y="416" width="1020" height="286" rx="14" fill="#fff" stroke="#d7e1eb"/>
<text x="52" y="452" font-size="21" font-weight="700">如果希望保留第三方认证：本文建议的处理顺序</text>
<g stroke="#526777" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M256 521H328"/><path d="M650 521H792"/><path d="M489 552V602"/></g>
<rect x="52" y="490" width="204" height="62" rx="8" fill="#e8eff8"/><text x="154" y="528" font-size="19" text-anchor="middle">身份已确认</text>
<rect x="328" y="490" width="322" height="62" rx="8" fill="#ddf3ec"/><text x="489" y="528" font-size="19" text-anchor="middle">服务端检查适用政策与同意</text>
<text x="722" y="510" font-size="16" text-anchor="middle">齐全</text>
<rect x="792" y="490" width="228" height="62" rx="8" fill="#e8eff8"/><text x="906" y="528" font-size="19" text-anchor="middle">创建可用账户</text>
<text x="510" y="583" font-size="16">缺少必需项</text>
<rect x="328" y="602" width="322" height="62" rx="8" fill="#fff1d9"/><text x="489" y="640" font-size="19" text-anchor="middle">补充同意；暂不开放业务权限</text>
<text x="52" y="681" font-size="16" fill="#536777">用户返回补充页面后重新提交检查；临时数据也需规定用途和清理期限。</text>
</g></svg>
