<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="625" viewBox="0 0 1080 625" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#536778"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#243447" font-weight="bold">从提出想法到运行游戏：两种循环承担不同任务</text><text x="36" y="83" font-size="17" fill="#243447" font-weight="normal">上半部是建议的开发流程；下半部依据 Battle Drones 仓库职责概括。</text><rect x="28" y="108" width="1024" height="183" rx="12" fill="#e9eef7"/><text x="48" y="139" font-size="20" fill="#243447" font-weight="bold">开发时：人决定是否值得继续</text><rect x="48" y="161" width="292" height="90" rx="12" fill="#ffffff"/><text x="64" y="193" font-size="21" fill="#243447" font-weight="bold">提出具体问题</text><text x="64" y="225" font-size="17" fill="#243447" font-weight="normal">等待太久？看不懂反馈？</text><rect x="390" y="161" width="292" height="90" rx="12" fill="#ffffff"/><text x="406" y="193" font-size="21" fill="#243447" font-weight="bold">模型修改程序</text><text x="406" y="225" font-size="17" fill="#243447" font-weight="normal">生成规则、画面与声音</text><rect x="732" y="161" width="292" height="90" rx="12" fill="#ffffff"/><text x="748" y="193" font-size="21" fill="#243447" font-weight="bold">运行与检查</text><text x="748" y="225" font-size="17" fill="#243447" font-weight="normal">自动测试 + 真人试玩</text><path d="M342 206 L386 206" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><path d="M684 206 L728 206" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><path d="M878 254 L878 272 L195 272 L195 254" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><rect x="28" y="313" width="1024" height="286" rx="12" fill="#e6f2ee"/><text x="48" y="345" font-size="20" fill="#243447" font-weight="bold">游玩时：浏览器执行已生成的程序</text><rect x="48" y="382" width="255" height="111" rx="12" fill="#ffffff"/><text x="62" y="412" font-size="20" fill="#243447" font-weight="bold">玩家或内置电脑对手</text><text x="62" y="444" font-size="17" fill="#243447" font-weight="normal">发出移动、建造等命令</text><text x="62" y="471" font-size="17" fill="#243447" font-weight="normal"></text><rect x="365" y="382" width="285" height="111" rx="12" fill="#ffffff"/><text x="379" y="412" font-size="20" fill="#243447" font-weight="bold">规则模拟</text><text x="379" y="444" font-size="17" fill="#243447" font-weight="normal">固定步长更新世界状态</text><text x="379" y="471" font-size="17" fill="#243447" font-weight="normal">资源、位置、伤害与胜负</text><rect x="712" y="382" width="310" height="111" rx="12" fill="#ffffff"/><text x="726" y="412" font-size="20" fill="#243447" font-weight="bold">画面、声音与界面</text><text x="726" y="444" font-size="17" fill="#243447" font-weight="normal">读取状态，呈现变化</text><text x="726" y="471" font-size="17" fill="#243447" font-weight="normal">让玩家看到操作的结果</text><path d="M306 438 L361 438" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><path d="M653 438 L708 438" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><text x="48" y="538" font-size="19" fill="#243447" font-weight="normal">同一套规则模拟还可供自动对战和回放复用。</text><text x="48" y="571" font-size="19" fill="#23664e" font-weight="normal">模型参与制作，不表示普通单人玩法每一步都要调用模型。</text></g></svg>