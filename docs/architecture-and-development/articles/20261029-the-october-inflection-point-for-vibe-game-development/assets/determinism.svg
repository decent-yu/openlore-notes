<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#536778"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="45" font-size="27" fill="#243447" font-weight="bold">只传命令为何还可能失去同步？</text><text x="32" y="78" font-size="17" fill="#243447" font-weight="normal">以下为假设示意，用于解释确定性同步；不是实际故障测量。</text><rect x="32" y="108" width="936" height="62" rx="12" fill="#e9eef7"/><text x="54" y="147" font-size="22" fill="#243447" font-weight="bold">相同起点 + 相同规则版本 + 相同随机种子 + 相同步骤的命令</text><path d="M302 173 L302 213" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><path d="M702 173 L702 213" fill="none" stroke="#536778" stroke-width="2" marker-end="url(#a)"/><rect x="62" y="219" width="376" height="142" rx="12" fill="#ffffff"/><text x="82" y="253" font-size="23" fill="#243447" font-weight="bold">浏览器 A</text><text x="82" y="291" font-size="20" fill="#243447" font-weight="normal">第 k 步：执行移动命令</text><text x="82" y="329" font-size="20" fill="#243447" font-weight="normal">计算位置，再判断能否攻击</text><rect x="562" y="219" width="376" height="142" rx="12" fill="#ffffff"/><text x="582" y="253" font-size="23" fill="#243447" font-weight="bold">浏览器 B</text><text x="582" y="291" font-size="20" fill="#243447" font-weight="normal">第 k 步：执行移动命令</text><text x="582" y="329" font-size="20" fill="#243447" font-weight="normal">计算位置，再判断能否攻击</text><text x="62" y="407" font-size="20" fill="#a24b22" font-weight="bold">若数值或处理顺序有差异</text><text x="62" y="441" font-size="21" fill="#243447" font-weight="normal">一端先进入射程 → 先开火 → 后续胜负可能分叉</text><text x="62" y="493" font-size="20" fill="#23664e" font-weight="normal">应检查：随机来源、更新顺序、数学函数、规则版本</text><text x="62" y="529" font-size="19" fill="#23664e" font-weight="normal">验证：逐步比较状态摘要；一致时才能继续信任回放或对局</text></g></svg>