<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">对象可以并行准备，同一个分支的发布仍须确定顺序</title>
  <desc id="desc">假设两个智能体从提交 C0 出发，分别生成 C1 和 C2。它们可以同时保存对象并完成校验，但都要求主分支当前仍为 C0。第一个更新成功后，第二个旧值条件不再成立，不能覆盖第一个结果。图中步骤是正确性示意，并非 GitHub 内部协议。</desc>
  <defs>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172c40}.heading{font-size:25px;font-weight:650}.label{font-size:21px;font-weight:600}.body{font-size:19px}.note{font-size:17px;fill:#506579}.edge{fill:none;stroke:#617587;stroke-width:2}</style>
  </defs>
  <rect width="1120" height="650" rx="18" fill="#f5f8fb"/>
  <text x="36" y="48" class="heading">可以同时上传，不代表可以同时覆盖 main</text>
  <text x="36" y="80" class="note">假设例子：两次普通推送都基于 C0；以下是正确性步骤示意，不是 GitHub 内部协议。</text>
  <path d="M220 118H1060" class="edge"/><text x="36" y="126" class="body">阅读顺序 →</text>
  <rect x="218" y="145" width="341" height="260" rx="12" fill="#e6f1f6"/>
  <text x="388" y="181" text-anchor="middle" class="label">准备对象：可以并行</text>
  <text x="36" y="241" class="label">智能体 A</text><text x="36" y="270" class="note">C0 → C1</text>
  <rect x="244" y="211" width="289" height="72" rx="9" fill="#fff" stroke="#a8c1d2"/>
  <text x="388" y="240" text-anchor="middle" class="body">保存 C1 及其依赖对象</text><text x="388" y="268" text-anchor="middle" class="body">完成必要校验</text>
  <text x="36" y="350" class="label">智能体 B</text><text x="36" y="379" class="note">C0 → C2</text>
  <rect x="244" y="319" width="289" height="72" rx="9" fill="#fff" stroke="#a8c1d2"/>
  <text x="388" y="348" text-anchor="middle" class="body">保存 C2 及其依赖对象</text><text x="388" y="376" text-anchor="middle" class="body">完成必要校验</text>
  <path d="M533 247H610M533 355H610" class="edge"/>
  <rect x="611" y="145" width="471" height="260" rx="12" fill="#fff0dc"/>
  <text x="846" y="181" text-anchor="middle" class="label">发布同一个引用：必须判定先后</text>
  <rect x="634" y="211" width="424" height="72" rx="9" fill="#fff" stroke="#c9b58a"/>
  <text x="654" y="240" class="body">① 当前 main = C0，条件成立</text><text x="654" y="268" class="body" fill="#17675c">发布 C1 → main = C1</text>
  <path d="M1018 284V318" class="edge"/>
  <rect x="634" y="319" width="424" height="72" rx="9" fill="#fff" stroke="#c9b58a"/>
  <text x="654" y="348" class="body">② 当前 main ≠ C0，条件不成立</text><text x="654" y="376" class="body">拒绝旧条件更新，不能直接覆盖为 C2</text>
  <rect x="36" y="433" width="1046" height="112" rx="12" fill="#e3efea"/>
  <text x="58" y="468" class="label">B 接下来做什么？</text>
  <text x="58" y="500" class="body">读取 C1，将自己的修改整合进去，生成新提交，再提交更新请求。</text>
  <text x="58" y="528" class="note">如果 A、B 更新的是不同分支，它们的引用发布通常不必互相排队；共同的存储资源仍有限。</text>
  <text x="36" y="590" class="body">发布前提：必要对象已可靠保存，规定的检查已通过，引用的旧值条件仍成立。</text>
  <g fill="#617587"><path d="M1060 118l-10 -5v10Z M610 247l-10 -5v10Z M610 355l-10 -5v10Z M1018 318l-5 -10h10Z"/></g>
  <text x="36" y="622" class="note">机制依据：Git 的 update-ref、receive-pack 与 push 文档；图中 C0、C1、C2 为简写标识。</text>
</svg>
