<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">请求取消后，缓存页仍要等待远端写入结束才能复用</title>
  <desc id="desc">上半图说明危险的顺序：请求 A 被取消，页面立刻给 B，A 的迟到写入破坏 B。下半图说明延迟回收：A 被取消后页面暂留，等远端确认所有写入结束，再交给 B。图不按真实时间比例绘制，超时安全性还需另行验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b44635"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c3048}.title{font-size:29px;font-weight:650}.head{font-size:23px;font-weight:600}.body{font-size:20px}.small{font-size:18px;fill:#56677b}.axis{stroke:#9aa9ba;stroke-width:2;marker-end:url(#arrow)}.dot{fill:#fff;stroke:#526880;stroke-width:2.5}</style>
  </defs>
  <rect width="1120" height="690" rx="20" fill="#f5f7fa"/>
  <text x="42" y="51" class="title">“请求已取消”不等于“远端已经停写”</text>
  <text x="42" y="84" class="small">另一类相关故障：写入与回收争用同一物理页。横向只表示先后，不表示实际时长。</text>
  <text x="42" y="137" class="head">立即回收：迟到的数据写进了新请求</text>
  <path d="M74 213H1065" class="axis"/>
  <circle cx="116" cy="213" r="7" class="dot"/><circle cx="391" cy="213" r="7" class="dot"/><circle cx="664" cy="213" r="7" class="dot"/><circle cx="965" cy="213" r="7" class="dot"/>
  <text x="116" y="185" text-anchor="middle" class="body">A 开始传输</text>
  <text x="391" y="185" text-anchor="middle" class="body">A 被取消</text>
  <text x="664" y="185" text-anchor="middle" class="body">同一页分给 B</text>
  <text x="965" y="185" text-anchor="middle" class="body">A 的写入才到达</text>
  <rect x="92" y="243" width="299" height="43" rx="6" fill="#dce5ef"/>
  <text x="241" y="272" text-anchor="middle" class="body">A 使用</text>
  <rect x="398" y="243" width="259" height="43" rx="6" fill="#e8edf3"/>
  <text x="527" y="272" text-anchor="middle" class="body">已回收，可被分配</text>
  <rect x="664" y="243" width="364" height="43" rx="6" fill="#fae0d6"/>
  <text x="846" y="272" text-anchor="middle" class="body">B 使用，却被 A 改写</text>
  <path d="M116 303C300 347 775 347 965 293" fill="none" stroke="#b44635" stroke-width="2.5" marker-end="url(#red)"/>
  <text x="532" y="359" text-anchor="middle" class="small">取消通知无法撤回已经发出的远端写入</text>
  <path d="M42 373H1078" stroke="#d6dfe8"/>
  <text x="42" y="416" class="head">延迟回收：先确认写入结束，再允许复用</text>
  <path d="M74 493H1065" class="axis"/>
  <circle cx="116" cy="493" r="7" class="dot"/><circle cx="391" cy="493" r="7" class="dot"/><circle cx="722" cy="493" r="7" class="dot"/><circle cx="1000" cy="493" r="7" class="dot"/>
  <text x="116" y="464" text-anchor="middle" class="body">A 开始传输</text>
  <text x="391" y="464" text-anchor="middle" class="body">A 被取消</text>
  <text x="722" y="464" text-anchor="middle" class="body">远端确认写入已结束</text>
  <text x="1000" y="464" text-anchor="middle" class="body">分给 B</text>
  <rect x="92" y="523" width="299" height="43" rx="6" fill="#dce5ef"/>
  <text x="241" y="552" text-anchor="middle" class="body">A 使用</text>
  <rect x="398" y="523" width="324" height="43" rx="6" fill="#fff0c9" stroke="#c9a451"/>
  <text x="560" y="552" text-anchor="middle" class="body">暂留页面，禁止复用</text>
  <rect x="729" y="523" width="264" height="43" rx="6" fill="#e8edf3"/>
  <text x="861" y="552" text-anchor="middle" class="body">可重新分配</text>
  <rect x="1000" y="523" width="78" height="43" rx="6" fill="#d9eee9" stroke="#388878"/>
  <text x="1039" y="552" text-anchor="middle" class="body">B</text>
  <text x="42" y="615" class="body">等待确认会暂时占用容量；超时后能否回收，还取决于写入能否确定停止。</text>
  <text x="42" y="653" class="small">来源：SGLang #41023、#37077 与 Cloudflare 原文。此图展示收到有效确认的路径。</text>
</svg>
