<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
  <title id="title">请求预留了八页，传输却只覆盖第一页</title>
  <desc id="desc">根据 Cloudflare 事故报告绘制的简化示意。长请求被拒绝并换成一个词元的占位输入，预填充端只传输少量数据；生成端仍读取原先预留的八页，后七页中残留其他请求的状态。页数仅为机制示例。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#41536a"/></marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b44635"/></marker>
    <pattern id="old" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff1e8"/><path d="M-2 2L2-2M0 10L10 0M8 12L12 8" stroke="#edc7ac" stroke-width="1"/></pattern>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c3048}.title{font-size:29px;font-weight:650}.sub{font-size:18px;fill:#5a6a7e}.label{font-size:21px;font-weight:600}.body{font-size:19px}.small{font-size:17px}.path{fill:none;stroke:#41536a;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1120" height="750" rx="20" fill="#f5f7fa"/>
  <text x="42" y="51" class="title">预留成功 ≠ 本次数据已写满</text>
  <text x="42" y="83" class="sub">事故路径示意；8 页只是帮助理解的缩小例子，不代表实际缓存大小。</text>
  <rect x="42" y="121" width="246" height="125" rx="12" fill="#fff" stroke="#c7d1de"/>
  <text x="62" y="156" class="label">① 路由器</text>
  <text x="62" y="189" class="body">发送请求及原始长度</text>
  <text x="62" y="220" class="small">生成端据此预留 8 页</text>
  <path d="M288 183H342" class="path"/>
  <rect x="355" y="121" width="341" height="125" rx="12" fill="#fff" stroke="#c7d1de"/>
  <text x="377" y="156" class="label">② 预填充端：拒绝长输入</text>
  <text x="377" y="189" class="body">记录待返回错误，换成占位输入</text>
  <text x="377" y="220" class="small">准入检查漏看拒绝状态，继续计算</text>
  <path d="M696 183H753" class="path"/>
  <rect x="765" y="121" width="313" height="125" rx="12" fill="#fff" stroke="#c7d1de"/>
  <text x="787" y="156" class="label">③ 传输端</text>
  <text x="787" y="189" class="body">仅传少量占位输入的缓存</text>
  <text x="787" y="220" class="small">仍通知“传输完成”</text>
  <path d="M922 246V288H24V438H35" class="path"/>
  <text x="204" y="315" class="body">只有第一页被本次传输覆盖</text>
  <text x="42" y="357" class="label">④ 生成端：已给当前请求分配的物理页</text>
  <g>
    <rect x="42" y="383" width="119" height="110" rx="8" fill="#d9eee9" stroke="#388878" stroke-width="2"/>
    <text x="101" y="417" text-anchor="middle" class="label">P0</text><text x="101" y="454" text-anchor="middle" class="small">本次占位数据</text>
    <rect x="173" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="232" y="417" text-anchor="middle" class="label">P1</text><text x="232" y="454" text-anchor="middle" class="small">旧数据</text>
    <rect x="304" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="363" y="417" text-anchor="middle" class="label">P2</text><text x="363" y="454" text-anchor="middle" class="small">旧数据</text>
    <rect x="435" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="494" y="417" text-anchor="middle" class="label">P3</text><text x="494" y="454" text-anchor="middle" class="small">旧数据</text>
    <rect x="566" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="625" y="417" text-anchor="middle" class="label">P4</text><text x="625" y="454" text-anchor="middle" class="small">旧数据</text>
    <rect x="697" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="756" y="417" text-anchor="middle" class="label">P5</text><text x="756" y="454" text-anchor="middle" class="small">旧数据</text>
    <rect x="828" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="887" y="417" text-anchor="middle" class="label">P6</text><text x="887" y="454" text-anchor="middle" class="small">旧数据</text>
    <rect x="959" y="383" width="119" height="110" rx="8" fill="url(#old)" stroke="#c78559"/>
    <text x="1018" y="417" text-anchor="middle" class="label">P7</text><text x="1018" y="454" text-anchor="middle" class="small">旧数据</text>
  </g>
  <path d="M48 511V527H1072V511" fill="none" stroke="#b44635" stroke-width="2.5"/>
  <path d="M560 527V570" fill="none" stroke="#b44635" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <text x="42" y="564" class="small" fill="#a44031">⑤ 仍按原始长度读取全部 8 页</text>
  <rect x="283" y="585" width="554" height="66" rx="12" fill="#fff" stroke="#d49c91"/>
  <text x="560" y="626" text-anchor="middle" class="label">回答可能混入其他请求留下的内容</text>
  <text x="42" y="696" class="body">修复要阻止这次交接，并让生成端验证数据是否就绪；仅看到“完成”不够。</text>
  <text x="42" y="727" class="small">来源：Cloudflare 事故原文；旧数据为模型内部状态，不是按页存放的原始文本。</text>
</svg>
