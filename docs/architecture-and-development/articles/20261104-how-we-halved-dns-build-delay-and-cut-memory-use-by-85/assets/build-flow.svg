<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">定向构建如何确定安全的工作范围</title>
<desc id="desc">从上向下阅读，实线表示处理顺序，虚线表示数据库提供当前状态。事件先形成计划，等待合并，执行前检查副本和发布状态，通过后生成输出、删除旧键并写入，最后确认消息。</desc>
<defs>
<linearGradient id="bg" x2="0%" y2="100%"><stop stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
<text x="800" y="85" font-size="36" font-weight="800" fill="#0f172a">先确定影响范围，再用当前状态检查计划</text>
<text x="800" y="125" font-size="16" fill="#64748b">从上向下阅读 · 实线表示处理顺序 · 虚线表示读取数据 · 依据原文简化</text>
<g filter="url(#shadow)">
<rect x="110" y="180" width="880" height="125" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="110" y="350" width="880" height="125" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
<rect x="110" y="520" width="880" height="125" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
<rect x="110" y="690" width="880" height="125" rx="18" fill="#f0fdf4" stroke="#86efac"/>
<rect x="1100" y="520" width="390" height="125" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="1100" y="180" width="390" height="295" rx="18" fill="#fff7ed" stroke="#fdba74"/>
</g>
<g font-size="24" font-weight="700" fill="#0f172a">
<text x="550" y="226">① 读取事件，列出需要处理的名称</text>
<text x="550" y="396">② 合并同一区域已排队的工作</text>
<text x="550" y="566">③ 执行前检查副本与发布状态</text>
<text x="550" y="736">④ 更新输出，成功后确认消息</text>
<text x="1295" y="566">数据库只读副本</text>
<text x="1295" y="226">检查后可能调整计划</text>
</g>
<g font-size="20" fill="#475569">
<text x="550" y="268">识别记录、元数据、删除与全量需求</text>
<text x="550" y="438">工作范围取并集，保留所有待确认消息</text>
<text x="550" y="608">副本过旧则拒绝；按当前状态决定实际工作</text>
<text x="550" y="778">清除失效键；需要时先写记录，再写元数据</text>
<text x="1295" y="608">设置、发布资格、同名区域</text>
<text x="1295" y="282">扩大为全量构建</text>
<text x="1295" y="326">改为清除或跳过</text>
<text x="1295" y="370">重建共享元数据</text>
<text x="1295" y="430" font-size="16">超大区域另有受限处理规则</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M550 305V346"/>
<path d="M550 475V516"/>
<path d="M550 645V686"/>
<path d="M1100 582H994" stroke-dasharray="6,6"/>
</g>
</g>
</svg>
