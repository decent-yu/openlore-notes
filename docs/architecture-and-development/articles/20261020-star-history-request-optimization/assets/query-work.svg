<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">先限制要读的时间，再做统计</title><desc id="desc">两条查询路径的概念比较。先聚合再截取结果，会反复处理全量记录；先按索引筛选时间范围，只聚合本页覆盖的记录。格子表示时间段，不表示记录数量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="630" rx="0" fill="#f7f9fc" stroke="none"/><text x="45" y="55" font-size="30" fill="#203449" font-weight="650">先限制要读的时间，再做统计</text><text x="45" y="91" font-size="18" fill="#53677c" font-weight="400">概念示意：每格代表一个时间段，格子面积不代表星标数量。</text><rect x="30" y="116" width="1140" height="218" rx="10" fill="#fff" stroke="#dde4ec"/><text x="50" y="151" font-size="23" fill="#9a4c22" font-weight="600">候选方案：聚合全部历史，再截取本页结果</text><text x="50" y="187" font-size="18" fill="#203449" font-weight="400">扫描本仓库的所有时间段</text><rect x="50" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="68" y="234" font-size="18" fill="#8a431e" font-weight="400">1</text><rect x="115" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="133" y="234" font-size="18" fill="#8a431e" font-weight="400">2</text><rect x="180" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="198" y="234" font-size="18" fill="#8a431e" font-weight="400">3</text><rect x="245" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="263" y="234" font-size="18" fill="#8a431e" font-weight="400">4</text><rect x="310" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="328" y="234" font-size="18" fill="#8a431e" font-weight="400">5</text><rect x="375" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="393" y="234" font-size="18" fill="#8a431e" font-weight="400">6</text><rect x="440" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="458" y="234" font-size="18" fill="#8a431e" font-weight="400">7</text><rect x="505" y="203" width="58" height="48" rx="6" fill="#fbe4d6" stroke="#e8b394"/><text x="523" y="234" font-size="18" fill="#8a431e" font-weight="400">8</text><path d="M578 226 L628 226" stroke="#64748b" stroke-width="2" fill="none"/><path d="M628 226 l-10 -5 v10 z" fill="#64748b"/><rect x="645" y="198" width="210" height="60" rx="10" fill="#fff3e9" stroke="#e8b394"/><text x="671" y="235" font-size="20" fill="#203449" font-weight="400">所有日期分组计数</text><path d="M870 226 L920 226" stroke="#64748b" stroke-width="2" fill="none"/><path d="M920 226 l-10 -5 v10 z" fill="#64748b"/><rect x="938" y="198" width="205" height="60" rx="10" fill="#eaf0f7" stroke="#ccd8e6"/><text x="966" y="235" font-size="20" fill="#203449" font-weight="400">仅返回本页汇总</text><text x="50" y="302" font-size="19" fill="#9a4c22" font-weight="400">下一页再次请求 → 仍可能重新扫描全部历史</text><rect x="30" y="354" width="1140" height="218" rx="10" fill="#fff" stroke="#dde4ec"/><text x="50" y="389" font-size="23" fill="#096d65" font-weight="600">已采用方案：先确定本页时间范围，再聚合</text><text x="50" y="425" font-size="18" fill="#203449" font-weight="400">通过索引只读取选中的时间段</text><rect x="50" y="441" width="58" height="48" rx="6" fill="#eef1f5" stroke="#dfe5ec"/><text x="68" y="472" font-size="18" fill="#9aa6b5" font-weight="400">1</text><rect x="115" y="441" width="58" height="48" rx="6" fill="#eef1f5" stroke="#dfe5ec"/><text x="133" y="472" font-size="18" fill="#9aa6b5" font-weight="400">2</text><rect x="180" y="441" width="58" height="48" rx="6" fill="#eef1f5" stroke="#dfe5ec"/><text x="198" y="472" font-size="18" fill="#9aa6b5" font-weight="400">3</text><rect x="245" y="441" width="58" height="48" rx="6" fill="#eef1f5" stroke="#dfe5ec"/><text x="263" y="472" font-size="18" fill="#9aa6b5" font-weight="400">4</text><rect x="310" y="441" width="58" height="48" rx