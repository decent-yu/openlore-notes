<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc"><title id="title">取消星标后，过去的计数也会改变</title><desc id="desc">假设第1天甲加星、第2天乙加星、第3天甲取消。第3天仅剩乙的记录。按剩余记录重建的累计曲线是0、1、1，而当时真实总数是1、2、1。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="565" rx="0" fill="#f7f9fc" stroke="none"/><text x="42" y="52" font-size="28" fill="#203449" font-weight="650">“目前仍存在”与“当时曾存在”是两种历史</text><text x="42" y="88" font-size="18" fill="#53677c" font-weight="400">假设例子：只有甲、乙两人；这不是 GitHub 的实测数据。</text><text x="210" y="143" font-size="22" fill="#203449" font-weight="600">第 1 天</text><text x="515" y="143" font-size="22" fill="#203449" font-weight="600">第 2 天</text><text x="820" y="143" font-size="22" fill="#203449" font-weight="600">第 3 天</text><path d="M220 177 L930 177" stroke="#64748b" stroke-width="2" fill="none"/><path d="M930 177 l-10 -5 v10 z" fill="#64748b"/><circle cx="250" cy="177" r="6" fill="#53677c"/><circle cx="555" cy="177" r="6" fill="#53677c"/><circle cx="860" cy="177" r="6" fill="#53677c"/><text x="208" y="218" font-size="21" fill="#203449" font-weight="400">甲加星</text><text x="510" y="218" font-size="21" fill="#203449" font-weight="400">乙加星</text><text x="805" y="218" font-size="21" fill="#9a4c22" font-weight="400">甲取消星标</text><rect x="42" y="247" width="1016" height="78" rx="10" fill="#fff" stroke="#dde4ec"/><text x="66" y="278" font-size="21" fill="#203449" font-weight="600">第 3 天的当前记录</text><text x="66" y="307" font-size="20" fill="#203449" font-weight="400">甲的记录已删除；只剩“乙在第 2 天加星”这一条记录。</text><text x="46" y="373" font-size="19" fill="#53677c" font-weight="400">所回答的问题</text><text x="410" y="373" font-size="18" fill="#53677c" font-weight="400">第 1 天</text><text x="630" y="373" font-size="18" fill="#53677c" font-weight="400">第 2 天</text><text x="840" y="373" font-size="18" fill="#53677c" font-weight="400">第 3 天</text><rect x="42" y="389" width="1016" height="51" rx="7" fill="#eaf0f7" stroke="none"/><text x="60" y="422" font-size="20" fill="#203449" font-weight="500">当天结束时真实总数</text><text x="434" y="423" font-size="24" fill="#203449" font-weight="600">1</text><text x="654" y="423" font-size="24" fill="#203449" font-weight="600">2</text><text x="864" y="423" font-size="24" fill="#203449" font-weight="600">1</text><rect x="42" y="450" width="1016" height="51" rx="7" fill="#e1f5f0" stroke="none"/><text x="60" y="483" font-size="20" fill="#203449" font-weight="500">第 3 天重建的累计曲线</text><text x="434" y="484" font-size="24" fill="#096d65" font-weight="600">0</text><text x="654" y="484" font-size="24" fill="#096d65" font-weight="600">1</text><text x="864" y="484" font-size="24" fill="#096d65" font-weight="600">1</text><text x="45" y="541" font-size="18" fill="#53677c" font-weight="400">两条曲线终点相同，过去的形状不同；当前状态无法恢复已删除的加星与取消事件。</text></g></svg>