<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">用地图规则给步兵和运输机创造用途</title><desc id="desc">群岛地图的简化示意，陆军沿桥进攻，运输机把步兵送往岛屿占点，战斗机能攻击驻军但不能代替步兵占点。非真实地图布局。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#236fa0"/></marker></defs>
<rect width="1120" height="620" rx="18" fill="#f4f8f7"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#1d3544">
<text x="42" y="53" font-size="28" font-weight="700">先改变获益条件，再增加单位种类</text>
<text x="42" y="85" font-size="17" fill="#536e78">依据 Archipelago 规则简化；只展示一座岛，不代表真实布局、岛屿总数或距离。</text>
<rect x="42" y="110" width="1036" height="342" rx="18" fill="#d7edf0"/>
<path d="M42 126 Q190 98 340 136 L330 213 369 258 331 310 345 426 Q180 457 42 428Z" fill="#c6d9ae"/>
<path d="M1078 126 Q913 103 790 143 L811 217 776 261 810 311 786 428 Q927 456 1078 426Z" fill="#d6d9ad"/>
<path d="M471 213 Q539 166 630 211 Q682 242 646 302 Q566 340 491 301 Q448 271 471 213Z" fill="#e0ddbb" stroke="#94b998" stroke-width="2"/>
<rect x="324" y="150" width="476" height="18" rx="4" fill="#a8a28e"/>
<rect x="333" y="377" width="464" height="18" rx="4" fill="#a8a28e"/>
<rect x="103" y="219" width="104" height="78" rx="10" fill="#366f9d"/>
<text x="155" y="266" text-anchor="middle" font-size="23" fill="#fff">蓝方基地</text>
<rect x="906" y="219" width="104" height="78" rx="10" fill="#b76d53"/>
<text x="958" y="266" text-anchor="middle" font-size="23" fill="#fff">红方基地</text>
<text x="563" y="143" text-anchor="middle" font-size="16" fill="#50616a">桥：陆军仍可进攻另一侧基地</text>
<path d="M217 253 Q362 188 500 250" fill="none" stroke="#236fa0" stroke-width="3" stroke-dasharray="9 6"/>
<path d="M500 250 l-10 -11 -4 12Z" fill="#236fa0"/>
<text x="354" y="226" text-anchor="middle" font-size="18" fill="#1a5c88">运输机运送步兵</text>
<circle cx="548" cy="261" r="24" fill="#fff9df" stroke="#967c34" stroke-width="2"/>
<text x="548" y="268" text-anchor="middle" font-size="18">点</text>
<circle cx="602" cy="267" r="9" fill="#366f9d"/>
<path d="M602 278 V296 M590 288 H614" stroke="#366f9d" stroke-width="5" stroke-linecap="round"/>
<text x="566" y="347" text-anchor="middle" font-size="17">步兵驻守，才持续获得收益</text>
<path d="M899 323 Q772 340 666 282" fill="none" stroke="#b76d53" stroke-width="3" stroke-dasharray="5 5"/>
<path d="M666 272 L681 287 M681 272 L666 287" stroke="#b76d53" stroke-width="3"/>
<text x="863" y="351" text-anchor="middle" font-size="17" fill="#8b4b35">空军能清除驻军</text>
<text x="863" y="375" text-anchor="middle" font-size="17" fill="#8b4b35">但不能代替步兵占点</text>
<text x="58" y="484" font-size="20" font-weight="700">三种职责形成具体联系</text>
<text x="58" y="521" font-size="19">运输机让步兵到达 → 步兵把控制点变成收入 → 空军争夺驻军的生存空间</text>
<text x="58" y="561" font-size="18" fill="#536e78">设计代价：规则更难解释；优势方也可能占得更多，需要继续检查强者越强的问题。</text>
</g></svg>
