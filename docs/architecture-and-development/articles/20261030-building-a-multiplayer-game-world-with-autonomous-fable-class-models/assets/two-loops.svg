<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">玩家创作与平台修复的两条链路</title>
<desc id="desc">上方从玩家要求经 Savi 修改当前世界到玩家体验。发现平台问题后，下方研发链路接收报告，复现修改，通过建议的独立验收与有限发布后返回体验。两条链路不共享全部权限；下方不是已核实的 Spawn 内部架构。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536579"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#237664"/></marker></defs>
<rect width="1100" height="720" fill="#f7f9fc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#172c41">
<text x="48" y="56" font-size="29" font-weight="600">同一个反馈，可以进入两种不同范围的修改</text>
<text x="48" y="90" font-size="17" fill="#536579">原文描述两条链路；绿色控制区为本文建议，不是 Spawn 内部实现图。</text>
<rect x="36" y="119" width="1028" height="220" rx="16" fill="#eaf0fa"/>
<text x="56" y="153" font-size="21" font-weight="600">创作链路 · 修改当前游戏</text>
<g fill="#fff" stroke="#b9c9df" stroke-width="1.5">
<rect x="58" y="187" width="205" height="105" rx="10"/>
<rect x="315" y="187" width="205" height="105" rx="10"/>
<rect x="572" y="187" width="205" height="105" rx="10"/>
<rect x="829" y="187" width="205" height="105" rx="10"/>
</g>
<g text-anchor="middle" font-size="21" font-weight="600">
<text x="160" y="224">玩家提出改动</text><text x="417" y="224">Savi 执行创作</text><text x="674" y="224">当前世界更新</text><text x="931" y="224">玩家实际体验</text>
</g>
<g text-anchor="middle" font-size="17" fill="#536579">
<text x="160" y="260">例如：添加骑乘</text><text x="417" y="260">调用工具修改内容</text><text x="674" y="260">配置、脚本等</text><text x="931" y="260">观察结果，再调整</text>
</g>
<g fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"><path d="M263 239H305"/><path d="M520 239H562"/><path d="M777 239H819"/>
<path d="M931 292V367H24V537H48"/></g>
<rect x="357" y="346" width="386" height="40" rx="20" fill="#f7f9fc"/>
<text x="550" y="373" text-anchor="middle" font-size="18" fill="#536579">发现平台问题 → 传递证据，不传递权限</text>
<rect x="36" y="402" width="1028" height="244" rx="16" fill="#edf0f3"/>
<text x="56" y="433" font-size="21" font-weight="600">研发链路 · 可能影响多个游戏</text>
<rect x="551" y="446" width="498" height="163" rx="12" fill="#e1f0e9" stroke="#68a18a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="800" y="471" text-anchor="middle" font-size="16" fill="#237664">建议：由独立检查与发布系统限制行动</text>
<g fill="#fff" stroke="#c4cdd6" stroke-width="1.5">
<rect x="58" y="488" width="205" height="97" rx="10"/><rect x="315" y="488" width="205" height="97" rx="10"/>
<rect x="572" y="488" width="205" height="97" rx="10"/><rect x="829" y="488" width="205" height="97" rx="10"/>
</g>
<g text-anchor="middle" font-size="21" font-weight="600">
<text x="160" y="523">报告与分类</text><text x="417" y="523">研发代理</text><text x="674" y="523">独立验收</text><text x="931" y="523">有限发布</text>
</g>
<g text-anchor="middle" font-size="17" fill="#536579">
<text x="160" y="557">记录版本与操作</text><text x="417" y="557">先复现，再修改</text><text x="674" y="557">正常与越权路径</text><text x="931" y="557">观察；失败则恢复</text>
</g>
<g fill="none" stroke="#536579" stroke-width="2" marker-end="url(#arrow)"><path d="M263 537H305"/><path d="M520 537H562"/><path d="M777 537H819"/></g>
<path d="M1034 535H1080V240H1044" fill="none" stroke="#237664" stroke-width="2" marker-end="url(#green)"/>
<text x="56" y="628" font-size="16" fill="#536579">不能复现或需要产品决定 → 保留证据，交由人判断；不强行修改。</text>
<text x="48" y="685" font-size="17" fill="#536579">读图重点：游戏内容修改成功，并不意味着平台缺陷已经验证、修复和安全上线。</text>
</g></svg>
